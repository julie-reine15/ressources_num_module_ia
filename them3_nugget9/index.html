<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coulisses IA : l'enquête — La Vigie</title>
<meta name="description" content="Activité interactive sur l'éthique de l'IA — incarnez un·e journaliste et bouclez le dossier spécial de La Vigie.">

<style>
/* ==========================================================================
   0. TOKENS — palette, typographie, espacements
   Thème "salle de rédaction / dossier d'enquête", clair, contrastes AA.
   Aucune police externe chargée (fonctionnement hors-ligne + pas d'appel
   tiers depuis l'iframe Moodle) : on s'appuie sur des piles de polices
   système qui donnent quand même une vraie identité (serif de titrage,
   monospace "pièce à conviction", sans-serif de lecture).
   ========================================================================== */
:root{
  /* couleurs */
  --paper:        #EFE8D8;   /* fond papier */
  --paper-deep:   #E4DAC2;   /* cartes / zones creusées */
  --paper-raised: #F7F2E6;   /* cartes / zones surélevées */
  --ink:          #1E2430;   /* texte principal */
  --ink-soft:     #4A5266;   /* texte secondaire */
  --ink-faint:    #7A8299;   /* métadonnées, légendes */
  --line:         #C9BE9F;   /* séparateurs, bordures discrètes */
  --line-strong:  #A79B77;

  --accent:       #9C2B22;   /* rouge d'imprimerie — actions, focus narratif */
  --accent-text:  #7A211A;   /* variante plus sombre, pour le texte/liens (contraste) */
  --accent-ink:   #631712;   /* hover/actif */
  --accent-tint:  #F1DCD6;   /* fond très clair du rouge, pour zones d'alerte douces */

  --gold:         #7A5E23;   /* tampons / badges */
  --gold-tint:    #EBDFB9;

  --success:      #2C5C41;
  --success-tint: #DCE7DA;

  --focus-ring:   #0B4FBF;

  /* typographie */
  --font-display: Montserrat, serif;
  --font-mono:    Montserrat, monospace;
  --font-body:    Montserrat, sans-serif;

  --fs-base: 17px;

  /* espacements & forme */
  --radius: 3px;
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.5rem;
  --max-w: 52rem;

  --shadow-card: 0 1px 0 var(--line), 0 8px 16px -12px rgba(30,36,48,0.35);
}

@media (prefers-reduced-motion: no-preference){
  :root{ --transition: 160ms ease; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* ==========================================================================
   1. RESET & BASE
   ========================================================================== */
*, *::before, *::after{ box-sizing: border-box; }
html{ font-size: var(--fs-base); -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  background: var(--paper);
  background-image:
    radial-gradient(var(--line) 0.6px, transparent 0.6px);
  background-size: 14px 14px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.55;
  min-height: 100vh;
}
h1, h2, h3, h4{
  font-family: var(--font-display);
  color: var(--ink);
  line-height: 1.2;
  margin: 0 0 0.6em;
}
h1{ font-size: 1.9rem; }
h2{ font-size: 1.5rem; }
h3{ font-size: 1.2rem; }
p{ margin: 0 0 1em; }
ul, ol{ margin: 0 0 1em; padding-left: 1.3em; }
a{ color: var(--accent-text); }
a:not(.card-link){ text-underline-offset: 0.15em; }
img, svg{ max-width: 100%; }
button{ font: inherit; }

.sr-only{
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* focus visible, cohérent partout, distinct des couleurs de statut */
:focus{ outline: none; }
:focus-visible{
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 2px;
}

.skip-link{
  position: absolute; left: -999px; top: 0; z-index: 100;
  background: var(--ink); color: var(--paper-raised);
  padding: 0.75em 1.2em; font-family: var(--font-mono); font-size: 0.95rem;
}
.skip-link:focus{ left: var(--space-2); top: var(--space-2); }

/* ==========================================================================
   2. MASTHEAD
   ========================================================================== */
.masthead{
  border-bottom: 3px solid var(--ink);
  background: var(--paper-raised);
  padding: var(--space-2) var(--space-2) var(--space-1);
}
.masthead__inner{
  max-width: var(--max-w);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: var(--space-2);
}
.masthead__title-group{ display:flex; flex-direction: column; gap: 0.15em; }
.masthead__eyebrow{
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.masthead__title{
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
}
.masthead__title small{
  display:block;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 400;
  color: var(--accent-text);
  letter-spacing: 0.04em;
  margin-top: 0.25em;
}
.masthead__actions{
  display: flex;
  justify-content: flex-end;
  align-items: center;
  grid-column: 2;
  grid-row: 1;
  margin-bottom: 0.25rem;
}
.masthead__back-link{
  white-space: nowrap;
  padding: 0.3rem 0.6rem;
  font-size: 0.82rem;
}
.masthead__progress{
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-align: right;
  min-width: 11rem;
  grid-column: 2;
  grid-row: 2;
}
.progress-track{
  display: flex;
  gap: 3px;
  margin-top: 0.4em;
}
.progress-seg{
  flex: 1 0 auto;
  width: 1rem;
  height: 0.55rem;
  background: var(--paper-deep);
  border: 1px solid var(--line-strong);
}
.progress-seg[data-done="true"]{
  background: var(--accent);
  border-color: var(--accent-ink);
}

/* ==========================================================================
   3. LAYOUT GÉNÉRAL
   ========================================================================== */
main{ display:block; }
.view{
  max-width: var(--max-w);
  margin: 0 auto;
  padding: var(--space-4) var(--space-2) var(--space-4);
}
.view-narrow{ max-width: 40rem; }

.storage-notice{
  max-width: var(--max-w);
  margin: var(--space-2) auto 0;
  padding: 0.75em 1em;
  background: var(--gold-tint);
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ink-soft);
}

footer.site-footer{
  border-top: 1px solid var(--line);
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-2) var(--space-4);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
  text-align: center;
}

/* ==========================================================================
   4. BOUTONS
   ========================================================================== */
.btn{
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.65em 1.3em;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper-raised);
  color: var(--ink);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition, 0s), color var(--transition, 0s), transform var(--transition, 0s);
}
.btn:hover{ background: var(--paper-deep); }
.btn:active{ transform: translateY(1px); }
.btn-primary{
  background: var(--accent);
  border-color: var(--accent-ink);
  color: #FFFFFF;
}
.btn-primary:hover{ background: var(--accent-ink); }
.btn-primary:disabled{
  background: var(--paper-deep);
  border-color: var(--line-strong);
  color: var(--ink-faint);
  cursor: not-allowed;
}
.btn-ghost{
  background: transparent;
  border-color: var(--line-strong);
  color: var(--ink-soft);
}
.btn-ghost:hover{ background: var(--paper-deep); color: var(--ink); }
.btn-row{ display:flex; flex-wrap:wrap; gap: 0.75em; margin-top: var(--space-2); }

/* ==========================================================================
   5. INTRO
   ========================================================================== */
.intro-kicker{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-text);
  margin-bottom: 0.6em;
}
.intro-lede p{ font-size: 1.05rem; }
.intro-note{
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ink-faint);
  border-left: 3px solid var(--line-strong);
  padding-left: 0.9em;
  margin-top: var(--space-3);
}

/* ==========================================================================
   6. TABLEAU DE BORD (grille des dossiers)
   ========================================================================== */
.volet{ margin-top: var(--space-4); }
.volet:first-of-type{ margin-top: var(--space-3); }
.volet__heading{
  display:flex;
  align-items:baseline;
  gap: 0.6em;
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: 0.4em;
  margin-bottom: var(--space-2);
}
.volet__heading h2{ margin:0; }
.volet__heading span{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
}

.dossier-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
  gap: var(--space-2);
  list-style: none;
  margin: 0; padding: 0;
}
.dossier-card{
  position: relative;
  display:block;
  background: var(--paper-raised);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-card);
  padding: var(--space-2);
  text-decoration: none;
  color: var(--ink);
  min-height: 9.5rem;
}
.dossier-card::before{
  content: "";
  position: absolute; top:0; left: 0.9em;
  width: 2.4em; height: 0.5em;
  background: var(--paper-deep);
  border: 1px solid var(--line-strong);
  border-top: none;
}
.dossier-card:hover{ background: var(--paper-deep); }
.dossier-card__tag{
  display: block;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
}
.dossier-card__title{
  display: block;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.08rem;
  margin: 0.35em 0 0.5em;
}
.dossier-card__status{
  font-family: var(--font-mono);
  font-size: 0.76rem;
  display: flex;
  align-items:center;
  gap: 0.4em;
  color: var(--ink-soft);
}
.dossier-card__status[data-state="solved"]{ color: var(--success); font-weight: 700; }
.dossier-card__badge{
  margin-top: 0.5em;
  display:inline-block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 0.2em 0.5em;
  border: 1px solid var(--gold);
  color: var(--gold);
  transform: rotate(-2deg);
}

.dossier-card--locked{
  opacity: 0.75;
  cursor: not-allowed;
}
.dossier-card--locked .dossier-card__title{ color: var(--ink-soft); }

/* tampon "PISTE RÉSOLUE" */
.stamp{
  position:absolute; top: 0.6em; right: 0.6em;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--success);
  border: 2px solid var(--success);
  border-radius: 999px;
  padding: 0.25em 0.55em;
  transform: rotate(6deg);
  background: var(--success-tint);
}

/* ==========================================================================
   7. VUE ENJEU (piste)
   ========================================================================== */
.piste-header{
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: var(--space-2);
  margin-bottom: var(--space-3);
}
.piste-header__meta{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
  display:flex; gap:0.8em; flex-wrap:wrap;
  margin-bottom: 0.5em;
}
.accroche{
  background: var(--paper-raised);
  border-left: 4px solid var(--accent);
  padding: var(--space-2);
  font-size: 1.02rem;
}
.accroche p:last-child{ margin-bottom: 0; }

.step{
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px dashed var(--line-strong);
}
.step:first-of-type{ border-top: none; }
.step__label{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-text);
  margin-bottom: 0.4em;
}
.step__contexte{ margin-bottom: var(--space-2); }
.step__question{ font-weight: 700; margin-bottom: 0.8em; }
.step__instructions{
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--ink-faint);
  margin: -0.4em 0 0.9em;
}

fieldset.option-set{
  border: none;
  margin: 0; padding: 0;
}
.option{
  display:block;
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  margin-bottom: 0.6em;
  border-radius: var(--radius);
}
.option label{
  display:flex;
  align-items:flex-start;
  gap: 0.7em;
  padding: 0.75em 0.9em;
  cursor:pointer;
}
.option input{ margin-top: 0.28em; flex: none; width: 1.1em; height: 1.1em; }
.option:has(input:checked){
  border-color: var(--ink);
  background: var(--paper-deep);
}
.option.is-correct{ border-color: var(--success); background: var(--success-tint); }
.option.is-incorrect{ border-color: var(--accent); background: var(--accent-tint); }
.option.is-disabled label{ cursor:not-allowed; color: var(--ink-faint); }

.option-feedback{
  font-size: 0.92rem;
  padding: 0.6em 0.9em;
  margin: -0.35em 0 0.6em;
  border-left: 3px solid var(--line-strong);
  color: var(--ink-soft);
}
.option-feedback[data-tone="correct"]{ border-color: var(--success); color: var(--success); }
.option-feedback[data-tone="incorrect"]{ border-color: var(--accent); color: var(--accent-text); }

.feedback-zone{
  margin-top: var(--space-2);
}
.feedback-panel{
  padding: var(--space-2);
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  margin-bottom: var(--space-2);
}
.feedback-panel[data-tone="correct"]{ border-color: var(--success); background: var(--success-tint); }
.feedback-panel[data-tone="incorrect"]{ border-color: var(--accent); background: var(--accent-tint); }
.feedback-panel[data-tone="neutral"]{ border-color: var(--line-strong); }
.feedback-panel__lead{ font-weight: 700; margin-bottom: 0.3em; display:block; }

.budget-counter{
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 0.8em;
}
.budget-counter[data-full="true"]{ color: var(--success); font-weight:700; }

/* tri : chaque indice = un fieldset avec un radiogroup de catégories */
.tri-indice{
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  padding: 0.9em;
  margin-bottom: 0.8em;
}
.tri-indice legend{
  padding: 0 0.3em;
  font-style: italic;
}
.tri-indice__categories{
  display:flex;
  flex-wrap:wrap;
  gap: 0.5em;
  margin-top: 0.6em;
}
.tri-indice__categories label{
  display:inline-flex;
  align-items:center;
  gap: 0.4em;
  border: 1px solid var(--line-strong);
  padding: 0.35em 0.7em;
  cursor:pointer;
  font-size: 0.9rem;
}
.tri-indice__categories input{ width: 1em; height: 1em; }
.tri-indice.is-correct{ border-color: var(--success); }
.tri-indice.is-incorrect{ border-color: var(--accent); }
.tri-indice__result{
  margin-top: 0.6em;
  font-size: 0.88rem;
  padding: 0.5em 0.7em;
}
.tri-indice__result[data-tone="correct"]{ background: var(--success-tint); color: var(--success); }
.tri-indice__result[data-tone="incorrect"]{ background: var(--accent-tint); color: var(--accent-text); }

/* ==========================================================================
   8. FICHE DE DOSSIER
   ========================================================================== */
.fiche{
  margin-top: var(--space-3);
  padding: var(--space-3);
  background: var(--paper-raised);
  border: 1px solid var(--ink);
  position: relative;
}
.fiche::before{
  content: "";
  position:absolute; left: -1px; top: -1px; bottom: -1px;
  width: 6px;
  background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 4px, var(--paper-raised) 4px, var(--paper-raised) 8px);
}
.fiche__unlock{
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.4em;
}
.fiche h3{ margin-bottom: 0.3em; }
.fiche__section{ margin-top: var(--space-2); }
.fiche__section h4{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-faint);
  margin-bottom: 0.35em;
}
.fiche__sources{ font-size: 0.88rem; color: var(--ink-soft); }
.fiche__sources li{ margin-bottom: 0.3em; }
.fiche__badge-earned{
  display:inline-block;
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  border: 1px dashed var(--gold);
  color: var(--gold);
  padding: 0.4em 0.7em;
}

/* ==========================================================================
   9. CONCLUSION
   ========================================================================== */
.conclusion-recap{
  list-style:none; margin: var(--space-2) 0; padding:0;
  display:grid; grid-template-columns: repeat(auto-fill, minmax(11rem,1fr));
  gap: 0.6em;
}
.conclusion-recap li{
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  padding: 0.6em 0.8em;
  font-size: 0.85rem;
}
.conclusion-recap a{ font-weight: 700; text-decoration:none; }
.conclusion-recap a:hover{ text-decoration: underline; }

/* ==========================================================================
   10. RESPONSIVE
   ========================================================================== */
@media (max-width: 30rem){
  h1{ font-size: 1.55rem; }
  .masthead__title{ font-size: 1.5rem; }
  .masthead__progress{ text-align:left; }
  .view{ padding: var(--space-3) 1.1rem var(--space-4); }
}
</style>
</head>

<script>
/* ==========================================================================
   SECTION 1 — DONNÉES
   Un objet par enjeu : tout le contenu (scénario, config d'interaction,
   fiche, sources) vit ici. Ajouter ou modifier un enjeu ne touche jamais
   la logique du moteur (section 3) — seuls ces objets changent.

   Schéma commun :
   { id, axe: "amont"|"aval", numero, famille: "decryptage"|"tri"|"verification",
     titrePiste, accroche, interaction, fiche }

   interaction pour "decryptage" et "verification" (moteur commun renderSteps) :
     { steps: [ ...étapes ] }
     étape "hypothesis" : choix non noté, mémorisé pour l'étape "review" suivante.
     étape "review"      : feedback conditionné par le choix de l'étape "hypothesis"
                            référencée (basedOnStep), puis avance automatiquement.
     étape "qcm"          : question notée classique (options avec correct + feedback).
     étape "budget-select": choisir exactement N options parmi M (checkbox),
                            chaque option porte "retain" (à privilégier) ou non
                            (piège, avec feedback dédié) + un feedback de synthèse.

   interaction pour "tri" (moteur renderTri) :
     { categories: [...], indices: [...], feedbackFinal }
   ========================================================================== */
const ENJEUX = [

// ---------------------------------------------------------------------------
// A1 — TRANSPARENCE (amont / décryptage — révision progressive)
// ---------------------------------------------------------------------------
{
  id: "A1", axe: "amont", numero: 1, famille: "decryptage",
  titrePiste: "L'algorithme qui ne voyait pas tous les visages",

const STORAGE_KEY = "coulisses-ia-progress-v1";

let storageAvailable = true;
function testStorage(){
  try{
    const t = "__test__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
storageAvailable = testStorage();

let memoryFallback = { unlocked: [], badges: {}, introSeen: false };

function loadProgress(){
  if(!storageAvailable) return Object.assign({unlocked:[],badges:{},introSeen:false}, memoryFallback);
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(!raw) return { unlocked: [], badges: {}, introSeen: false };
    const parsed = JSON.parse(raw);
    return {
      unlocked: Array.isArray(parsed.unlocked) ? parsed.unlocked : [],
      badges: (parsed.badges && typeof parsed.badges === "object") ? parsed.badges : {},
      introSeen: !!parsed.introSeen
    };
  }catch(e){ return { unlocked: [], badges: {}, introSeen: false }; }
}

function saveProgress(progress){
  if(!storageAvailable){ memoryFallback = progress; return; }
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    storageAvailable = false;
    memoryFallback = progress;
  }
}

// État applicatif global (non persisté, sauf via progress)
const APP = {
  view: "intro",              // "intro" | "dashboard" | "enjeu" | "conclusion"
  currentEnjeuId: null,
  progress: loadProgress(),
  runtime: {}                 // par enjeuId : état d'avancement en cours de piste
};

function isSolved(id){ return APP.progress.unlocked.indexOf(id) !== -1; }

function markSolved(id, mistakeMade){
  if(!isSolved(id)) APP.progress.unlocked.push(id);
  APP.progress.badges[id] = mistakeMade ? "apres-fausse-piste" : "sans-detour";
  saveProgress(APP.progress);
}

function getRuntime(id){
  if(!APP.runtime[id]) APP.runtime[id] = createRuntime(id);
  return APP.runtime[id];
}
function resetRuntime(id){
  APP.runtime[id] = createRuntime(id);
}
function createRuntime(id){
  const enjeu = ENJEUX_BY_ID[id];
  if(enjeu.famille === "tri"){
    return { assignments: {}, validated: false, mistakeMade: false };
  }
  // decryptage & verification : basés sur des étapes séquentielles
  return { stepIndex: 0, steps: {}, mistakeMade: false };
}
function getStepState(runtime, stepId){
  if(!runtime.steps[stepId]) runtime.steps[stepId] = { attemptedWrong: [], chosen: null, resolved: false, checked: {} };
  return runtime.steps[stepId];
}

const ENJEUX_BY_ID = {};
ENJEUX.forEach(function(e){ ENJEUX_BY_ID[e.id] = e; });

}

  return list.map(function(p){ return "<p>" + p + "</p>"; }).join("");
}

/* ==========================================================================
   SECTION 4 — RENDU DES VUES PRINCIPALES
   ========================================================================== */
function updateMasthead(){
  const total = ENJEUX.length;
  const done = APP.progress.unlocked.length;
  document.getElementById("progress-label").textContent = done + "/" + total + " pistes résolues";
  const track = document.getElementById("progress-track");
  track.innerHTML = "";
  ENJEUX.forEach(function(e){
    const seg = document.createElement("span");
    seg.className = "progress-seg";
    seg.setAttribute("data-done", isSolved(e.id) ? "true" : "false");
    track.appendChild(seg);
  });
}

function render(){
  const app = document.getElementById("app");
  updateMasthead();
  if(APP.view === "intro") return renderIntroView(app);
  if(APP.view === "dashboard") return renderDashboardView(app);
  if(APP.view === "enjeu") return renderEnjeuView(app, APP.currentEnjeuId);
  if(APP.view === "conclusion") return renderConclusionView(app);
}

function goTo(view, enjeuId){
  APP.view = view;
  APP.currentEnjeuId = enjeuId || null;
  if(view === "dashboard"){
    APP.progress.introSeen = true;
    saveProgress(APP.progress);
  }
  render();
  const app = document.getElementById("app");
  focusHeading(app);
  window.scrollTo({ top: 0, behavior: "auto" });
}

function renderIntroView(app){

    '<section class="view view-narrow" aria-labelledby="intro-h1">' +

      '<div class="intro-lede">' + paragraphs(INTRO.paragraphes) + '</div>' +
      '<p class="intro-note">' + INTRO.note + '</p>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn btn-primary" data-action="nav-dashboard">Prendre connaissance des pistes</button>' +
      '</div>' +
    '</section>';
}

/* ==========================================================================
   Vue \"enjeu\" — répartit vers le bon moteur selon la famille

/* ==========================================================================
   SECTION 5 — MOTEUR \"ÉTAPES\" (familles Décryptage & Vérification de source)
   Un seul moteur pour les deux familles : toutes deux sont des séquences
   d'étapes (hypothesis / review / qcm / budget-select). Ce qui distingue
   les familles pour l'apprenant, c'est uniquement le contenu et l'habillage
   narratif — jamais la logique, qui reste unique et partagée ici.
   ========================================================================== */
function renderStepsInteraction(e){
  const runtime = getRuntime(e.id);
  const steps = e.interaction.steps;
  let html = "";

  for(let i = 0; i <= runtime.stepIndex && i < steps.length; i++){
    const step = steps[i];
    const isActive = (i === runtime.stepIndex);
    html += renderStep(e, step, isActive);
  }

  if(runtime.solvedThisRender){
    html += renderFicheHtml(e);
  }

  return html;
}

function renderStep(e, step, isActive){
  const runtime = getRuntime(e.id);
  const stepState = getStepState(runtime, step.id);

  let inner = "";
  if(step.type === "hypothesis") inner = renderHypothesisStep(e, step, stepState, isActive);
  else if(step.type === "review") inner = renderReviewStep(e, step, stepState, isActive);
  else if(step.type === "qcm") inner = renderQcmStep(e, step, stepState, isActive);
  else if(step.type === "budget-select") inner = renderBudgetStep(e, step, stepState, isActive);

  return (
    '<div class="step" data-step-id="' + step.id + '">' +
      '<p class="step__label">' + step.label + '</p>' +
      '<div class="step__contexte"><p>' + step.contexte + '</p></div>' +
      inner +
    '</div>'
  );
}

function optionRow(e, step, stepState, opt, groupRole, extraDataAttrs, disabled){
  const chosen = stepState.chosen === opt.id;
  const wasWrong = stepState.attemptedWrong.indexOf(opt.id) !== -1;
  let cls = "option";
  if(disabled){
    // étape déjà passée : afficher l'état final (réponse retenue en vert)
    if(opt.correct === true) cls += " is-correct";
  }else{
    if(wasWrong) cls += " is-incorrect";
    if(chosen && opt.correct === true) cls += " is-correct";
  }
  if(disabled) cls += " is-disabled";
  return (
    '<div class="' + cls + '">' +
      '<label>' +
        '<input type="radio" name="' + e.id + "-" + step.id + '" value="' + opt.id + '"' +
          (chosen ? " checked" : "") + (disabled ? " disabled" : "") +
          ' data-role="' + groupRole + '" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '" data-option-id="' + opt.id + '"' + extraDataAttrs + '>' +
        '<span>' + opt.texte + '</span>' +
      '</label>' +
    '</div>'
  );
}

function renderHypothesisStep(e, step, stepState, isActive){
  let html = '<p class="step__question">' + step.question + '</p>';
  if(step.instructions) html += '<p class="step__instructions">' + step.instructions + '</p>';
  html += '<fieldset class="option-set"><legend class="sr-only">' + step.question + '</legend>';
  html += step.options.map(function(opt){
    return optionRow(e, step, stepState, opt, "hypothesis-option", "", !isActive);
  }).join("");
  html += '</fieldset>';

  if(stepState.chosen && isActive){
    html += '<div class="feedback-zone" aria-live="polite">' +
      '<div class="feedback-panel" data-tone="neutral">' +
        '<span class="feedback-panel__lead">Hypothèse enregistrée.</span>' +
        'Elle sera reprise à l\'étape suivante, à la lumière d\'un nouvel indice.' +
      '</div>' +
      '<button type="button" class="btn btn-primary" data-action="continue-step" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '">Continuer l\'enquête</button>' +
    '</div>';
  }
  return html;
}

function renderReviewStep(e, step, stepState, isActive){
  const priorState = getStepState(getRuntime(e.id), step.basedOnStep);
  const wasAligned = step.alignedOptionIds.indexOf(priorState.chosen) !== -1;
  const feedback = wasAligned ? step.feedbackAligned : step.feedbackRevise;

  let html = '<p class="step__question">' + step.question + '</p>';
  html += '<div class="feedback-zone" aria-live="polite">' +
    '<div class="feedback-panel" data-tone="' + (wasAligned ? "correct" : "incorrect") + '">' +
      feedback +
    '</div>';
  if(isActive){
    html += '<button type="button" class="btn btn-primary" data-action="continue-step" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '">' + step.continueLabel + '</button>';
  }
  html += '</div>';
  return html;
}

function renderQcmStep(e, step, stepState, isActive){
  let html = '<p class="step__question">' + step.question + '</p>';
  html += '<fieldset class="option-set"><legend class="sr-only">' + step.question + '</legend>';
  html += step.options.map(function(opt){
    return optionRow(e, step, stepState, opt, "qcm-option", "", !isActive);
  }).join("");
  html += '</fieldset>';

  if(stepState.chosen){
    const chosenOpt = step.options.filter(function(o){ return o.id === stepState.chosen; })[0];
    if(chosenOpt){
      html += '<div class="feedback-zone" aria-live="polite">' +
        '<div class="feedback-panel" data-tone="' + (chosenOpt.correct ? "correct" : "incorrect") + '">' +
          '<span class="feedback-panel__lead">' + (chosenOpt.correct ? "✓ Correct" : "Pas tout à fait") + '</span>' +
          chosenOpt.feedback +
        '</div>';
      if(chosenOpt.correct && isActive){
        const isLast = step.unlocksFiche;
        html += '<button type="button" class="btn btn-primary" data-action="continue-step" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '">' +
          (isLast ? "Publier la fiche de dossier" : "Continuer l'enquête") + '</button>';
      }
      html += '</div>';
    }
  }
  return html;
}

function renderBudgetStep(e, step, stepState, isActive){
  const checkedCount = Object.keys(stepState.checked).filter(function(k){ return stepState.checked[k]; }).length;
  const full = checkedCount >= step.budget;

  let html = '<p class="step__question">' + step.contexte + '</p>';
  html += '<p class="budget-counter" data-full="' + full + '" aria-live="polite">' + checkedCount + ' / ' + step.budget + ' vérification(s) sélectionnée(s)</p>';
  html += '<fieldset class="option-set"><legend class="sr-only">Choisissez ' + step.budget + ' vérifications</legend>';

  html += step.options.map(function(opt){
    const isChecked = !!stepState.checked[opt.id];
    const lockOthers = full && !isChecked;
    const showResult = stepState.resolved;
    let cls = "option";
    if(showResult){
      if(opt.retain) cls += isChecked ? " is-correct" : "";
      else if(isChecked) cls += " is-incorrect";
    }
    if(lockOthers && !stepState.resolved) cls += " is-disabled";
    return (
      '<div class="' + cls + '">' +
        '<label>' +
          '<input type="checkbox" value="' + opt.id + '"' + (isChecked ? " checked" : "") +
            ((lockOthers && !stepState.resolved) || stepState.resolved ? " disabled" : "") +
            ' data-role="budget-option" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '" data-option-id="' + opt.id + '">' +
          '<span>' + opt.texte + '</span>' +
        '</label>' +
        (showResult && !opt.retain && isChecked ? '<p class="option-feedback" data-tone="incorrect">' + opt.feedback + '</p>' : '') +
      '</div>'
    );
  }).join("");
  html += '</fieldset>';

  if(!stepState.resolved && isActive){
    html += '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary" data-action="validate-budget" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '" ' + (full ? "" : "disabled") + '>Valider mes vérifications</button>' +
    '</div>';
  }

  if(stepState.resolved){
    const allGood = step.options.every(function(o){ return !!stepState.checked[o.id] === !!o.retain; });
    html += '<div class="feedback-zone" aria-live="polite">' +
      '<div class="feedback-panel" data-tone="' + (allGood ? "correct" : "incorrect") + '">' +
        '<span class="feedback-panel__lead">' + (allGood ? "✓ Les bons réflexes." : "Quelques pièges vous ont eu.") + '</span>' +
        step.wrapupFeedback +
      '</div>';
    if(allGood && isActive){
      const isLast = step.unlocksFiche;
      html += '<button type="button" class="btn btn-primary" data-action="continue-step" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '">' +
        (isLast ? "Publier la fiche de dossier" : "Continuer l'enquête") + '</button>';
    }else if(!allGood && isActive){
      html += '<button type="button" class="btn btn-ghost" data-action="retry-budget" data-enjeu-id="' + e.id + '" data-step-id="' + step.id + '">Revoir ma sélection</button>';
    }
    html += '</div>';
  }

  return html;
}

/* ==========================================================================
   SECTION 6 — MOTEUR \"TRI\" (famille Classement d'indices)
   Accepte un nombre variable de catégories (2, 3...) — chaque indice est un
   groupe de radios natif, pas de glisser-déposer, pour un vrai support clavier.
   ========================================================================== */
function renderTriInteraction(e){
  const runtime = getRuntime(e.id);
  const cats = e.interaction.categories;
  const indices = e.interaction.indices;

  let html = '<div class="step"><p class="step__label">Classement d\'indices</p>';
  html += '<p class="step__instructions">Attribuez une catégorie à chaque indice, puis validez.</p>';

  indices.forEach(function(ind){
    const chosen = runtime.assignments[ind.id];
    const showResult = runtime.validated;
    let cls = "tri-indice";
    if(showResult){
      cls += (chosen === ind.correct) ? " is-correct" : " is-incorrect";
    }
    html += '<fieldset class="' + cls + '"><legend>' + ind.texte + '</legend>';
    html += '<div class="tri-indice__categories">';
    html += cats.map(function(cat){
      return (
        '<label>' +
          '<input type="radio" name="tri-' + e.id + "-" + ind.id + '" value="' + cat.id + '"' +
            (chosen === cat.id ? " checked" : "") + (runtime.validated ? " disabled" : "") +
            ' data-role="tri-option" data-enjeu-id="' + e.id + '" data-indice-id="' + ind.id + '" data-category-id="' + cat.id + '">' +
          '<span>' + cat.label + '</span>' +
        '</label>'
      );
    }).join("");
    html += '</div>';
    if(showResult){
      const correctCatLabel = cats.filter(function(c){ return c.id === ind.correct; })[0].label;
      if(chosen === ind.correct){
        html += '<p class="tri-indice__result" data-tone="correct">✓ Correct '+ ('<br>' +ind.piegeExplication) + '</p>';
      }else{
        html += '<p class="tri-indice__result" data-tone="incorrect">La bonne catégorie était \"' + correctCatLabel + '\". ' + (ind.piegeExplication || "") + '</p>';
      }
    }
    html += '</fieldset>';
  });

  const allAssigned = indices.every(function(ind){ return !!runtime.assignments[ind.id]; });

  if(!runtime.validated){
    html += '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary" data-action="validate-tri" data-enjeu-id="' + e.id + '" ' + (allAssigned ? "" : "disabled") + '>Valider le classement</button>' +
    '</div>';
  }else{
    const allCorrect = indices.every(function(ind){ return runtime.assignments[ind.id] === ind.correct; });
    html += '<div class="feedback-zone" aria-live="polite">' +
      '<div class="feedback-panel" data-tone="' + (allCorrect ? "correct" : "incorrect") + '">' +
        '<span class="feedback-panel__lead">' + (allCorrect ? "✓ Classement complet." : "Encore quelques ajustements.") + '</span>' +
        e.interaction.feedbackFinal +
      '</div>';
    if(allCorrect){
      html += '<button type="button" class="btn btn-primary" data-action="continue-step" data-enjeu-id="' + e.id + '" data-step-id="tri">Publier la fiche de dossier</button>';
    }else{
      html += '<button type="button" class="btn btn-ghost" data-action="retry-tri" data-enjeu-id="' + e.id + '">Revoir mon classement</button>';
    }
    html += '</div>';
  }

  html += '</div>';

  if(runtime.solvedThisRender){
    html += renderFicheHtml(e);
  }

  return html;
}

/* ==========================================================================
   SECTION 7 — GESTION DES ÉVÉNEMENTS (délégation sur #app)
   ========================================================================== */
function onAppClick(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.getAttribute("data-action");

  if(action === "noop"){ e.preventDefault(); return; }
  if(action === "nav-intro"){ e.preventDefault(); goTo("intro"); return; }
  if(action === "nav-dashboard"){ e.preventDefault(); goTo("dashboard"); return; }
  if(action === "nav-conclusion"){ e.preventDefault(); goTo("conclusion"); return; }
  if(action === "nav-enjeu"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    goTo("enjeu", id);
    return;
  }
  if(action === "restart-enjeu"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    resetRuntime(id);
    getRuntime(id)._forceReplay = true;
    render();
    announce("Piste réinitialisée. Vous pouvez la reprendre depuis le début.");
    return;
  }
  if(action === "continue-step"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    const stepId = btn.getAttribute("data-step-id");
    handleContinueStep(id, stepId);
    return;
  }
  if(action === "validate-budget"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    const stepId = btn.getAttribute("data-step-id");
    handleValidateBudget(id, stepId);
    return;
  }
  if(action === "retry-budget"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    const stepId = btn.getAttribute("data-step-id");
    const runtime = getRuntime(id);
    const stepState = getStepState(runtime, stepId);
    stepState.resolved = false;
    stepState.checked = {};
    render();
    announce("Sélection réinitialisée.");
    return;
  }
  if(action === "validate-tri"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    handleValidateTri(id);
    return;
  }
  if(action === "retry-tri"){
    e.preventDefault();
    const id = btn.getAttribute("data-enjeu-id");
    const runtime = getRuntime(id);
    runtime.validated = false;
    render();
    announce("Classement réinitialisé, vous pouvez ajuster vos réponses.");
    return;
  }
}

function onAppChange(e){
  const input = e.target;
  const role = input.getAttribute("data-role");
  if(!role) return;

  if(role === "hypothesis-option"){
    const id = input.getAttribute("data-enjeu-id");
    const stepId = input.getAttribute("data-step-id");
    const optionId = input.getAttribute("data-option-id");
    const stepState = getStepState(getRuntime(id), stepId);
    stepState.chosen = optionId;
    render();
    return;
  }

  if(role === "qcm-option"){
    const id = input.getAttribute("data-enjeu-id");
    const stepId = input.getAttribute("data-step-id");
    const optionId = input.getAttribute("data-option-id");
    handleQcmChoice(id, stepId, optionId);
    return;
  }

  if(role === "budget-option"){
    const id = input.getAttribute("data-enjeu-id");
    const stepId = input.getAttribute("data-step-id");
    const optionId = input.getAttribute("data-option-id");
    const stepState = getStepState(getRuntime(id), stepId);
    stepState.checked[optionId] = input.checked;
    render();
    return;
  }

  if(role === "tri-option"){
    const id = input.getAttribute("data-enjeu-id");
    const indiceId = input.getAttribute("data-indice-id");
    const categoryId = input.getAttribute("data-category-id");
    const runtime = getRuntime(id);
    runtime.assignments[indiceId] = categoryId;
    render();
    return;
  }
}

function handleQcmChoice(id, stepId, optionId){
  const e = ENJEUX_BY_ID[id];
  const step = findStep(e, stepId);
  const runtime = getRuntime(id);
  const stepState = getStepState(runtime, stepId);
  const opt = step.options.filter(function(o){ return o.id === optionId; })[0];

  stepState.chosen = optionId;
  if(!opt.correct){
    if(stepState.attemptedWrong.indexOf(optionId) === -1) stepState.attemptedWrong.push(optionId);
    runtime.mistakeMade = true;
  }
  render();
  announce(opt.correct ? "Bonne réponse." : "Ce n'est pas la bonne piste, un indice corrige le tir.");
}

function handleContinueStep(id, stepId){
  const e = ENJEUX_BY_ID[id];
  const runtime = getRuntime(id);

  if(e.famille === "tri"){
    markSolved(id, runtime.mistakeMade);
    runtime.solvedThisRender = true;
    render();
    focusFicheHeading();
    announce("Fiche de dossier débloquée pour la piste " + id + ".");
    return;
  }

  const stepState = getStepState(runtime, stepId);
  stepState.confirmed = true;
  const step = findStep(e, stepId);
  const isLast = step && step.unlocksFiche;

  if(isLast){
    markSolved(id, runtime.mistakeMade);
    runtime.solvedThisRender = true;
    render();
    focusFicheHeading();
    announce("Fiche de dossier débloquée pour la piste " + id + ".");
  }else{
    runtime.stepIndex = runtime.stepIndex + 1;
    render();
    focusActiveStep();
  }
}

function handleValidateBudget(id, stepId){
  const runtime = getRuntime(id);
  const stepState = getStepState(runtime, stepId);
  const step = findStep(ENJEUX_BY_ID[id], stepId);
  const allGood = step.options.every(function(o){ return !!stepState.checked[o.id] === !!o.retain; });
  if(!allGood) runtime.mistakeMade = true;
  stepState.resolved = true;
  render();
  announce(allGood ? "Bons réflexes de vérification." : "Certains choix méritent d'être revus.");
}

function handleValidateTri(id){
  const e = ENJEUX_BY_ID[id];
  const runtime = getRuntime(id);
  runtime.validated = true;
  const allCorrect = e.interaction.indices.every(function(ind){ return runtime.assignments[ind.id] === ind.correct; });
  if(!allCorrect) runtime.mistakeMade = true;
  render();
  announce(allCorrect ? "Classement entièrement correct." : "Certains indices sont mal classés.");
}

function findStep(e, stepId){
  return e.interaction.steps.filter(function(s){ return s.id === stepId; })[0];
}

function focusActiveStep(){
  const zone = document.getElementById("interaction-zone");
  if(!zone) return;
  const steps = zone.querySelectorAll(".step");
  const last = steps[steps.length - 1];
  if(last){ last.setAttribute("tabindex", "-1"); last.focus(); }
}
function focusFicheHeading(){
  const fiche = document.querySelector(".fiche h3");
  if(fiche){ fiche.setAttribute("tabindex", "-1"); fiche.focus(); }
}

/* ==========================================================================
   SECTION 8 — INITIALISATION
   ========================================================================== */
function init(){
  const app = document.getElementById("app");
  const backLink = document.querySelector(".masthead__back-link");
  app.addEventListener("click", onAppClick);
  app.addEventListener("change", onAppChange);
  if(backLink){
    backLink.addEventListener("click", function(e){
      e.preventDefault();
      goTo("intro");
    });
  }

  if(!storageAvailable){
    const notice = document.createElement("div");
    notice.className = "storage-notice";
    notice.setAttribute("role", "status");
    notice.textContent = "Le stockage local est indisponible dans ce contexte (par ex. certains navigateurs partitionnent le stockage dans une iframe) : votre progression ne sera pas conservée d'une visite à l'autre.";
    document.querySelector(".masthead").insertAdjacentElement("afterend", notice);
  }

  APP.view = APP.progress.introSeen ? "dashboard" : "intro";
  render();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
}else{
  init();
}

   console du navigateur, notamment utile en Phase 3 pour vérifier le
   comportement une fois embarqué dans l'iframe Moodle. Sans effet sur le
   fonctionnement de l'activité. */
window.CoulissesIADebug = {
  APP: APP, ENJEUX: ENJEUX, ENJEUX_BY_ID: ENJEUX_BY_ID,
  goTo: goTo, getRuntime: getRuntime, resetRuntime: resetRuntime, isSolved: isSolved,
  storageAvailable: function(){ return storageAvailable; }
};

</script>
