<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coulisses IA • l'enquête (2/2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --encre:#1a1420;
    --gris:#575060;
    --brique:#631712;
    --brique-clair:#f7eeed;
    --surligneur:#b2e084;
    --filet:#e4dfe9;
    --blanc:#ffffff;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;padding:28px 20px 64px;
    background:var(--blanc);color:var(--encre);
    font-family:'Montserrat','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.6;
  }
  .feuille{max-width:920px;margin:0 auto;}

  h1{font-size:1.5rem;line-height:1.2;letter-spacing:-0.02em;font-weight:700;margin:0 0 12px;}
  h2{font-size:1.05rem;font-weight:700;margin:0 0 8px;letter-spacing:-0.01em;}
  h3{font-size:1rem;font-weight:700;margin:0 0 10px;}
  p{margin:0 0 12px;}
  .large{max-width:62ch;}
  .gris{color:var(--gris);}

  .commande{border-left:4px solid var(--brique);padding:2px 0 2px 18px;margin:0 0 32px;}
  .commande p:last-child{margin-bottom:0;}

  .nav-accueil{
    display:inline-block;background:none;border:0;padding:0;margin:0 0 14px;
    font:inherit;font-size:0.85rem;font-weight:600;color:var(--gris);cursor:pointer;
  }
  .nav-accueil:hover{color:var(--brique);}
  .nav-accueil:focus-visible{outline:3px solid var(--brique);outline-offset:3px;}

  .amorce{margin:0 0 30px;padding:20px 22px;background:var(--brique-clair);}
  .amorce p{max-width:58ch;}
  .amorce p:last-child{margin-bottom:0;}

  .etape{margin:0 0 34px;}
  .consigne{color:var(--gris);max-width:62ch;margin:0 0 18px;}

  /* hub */
  .axe{margin:0 0 30px;}
  .axe > h2{margin-bottom:14px;}
  .cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .carte{
    display:flex;flex-direction:column;align-items:stretch;text-align:left;
    border:1px solid var(--filet);border-top:3px solid var(--encre);
    background:var(--blanc);padding:18px 18px 16px;cursor:pointer;font:inherit;color:inherit;
  }
  .carte:hover{border-color:var(--brique);border-top-color:var(--brique);}
  .carte:focus-visible{outline:3px solid var(--brique);outline-offset:3px;}
  .carte .titre{font-weight:700;line-height:1.3;margin:0 0 8px;}
  .carte .chapeau{font-size:0.88rem;color:var(--gris);margin:0 0 14px;flex:1;}
  .carte .etat{font-size:0.8rem;color:var(--gris);padding-top:10px;border-top:1px solid var(--filet);}
  .carte.fait{border-top-color:var(--brique);background:var(--brique-clair);}
  .carte.fait .etat{color:var(--brique);font-weight:600;}

  .avancement{
    display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;
    margin:0 0 28px;padding-bottom:18px;border-bottom:1px solid var(--filet);
  }
  .avancement strong{font-size:1.05rem;}

  /* fiches sources */
  .sources{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .fiche{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:20px;}
  .fiche.reponse{border-top-color:var(--brique);}
  .provenance{font-size:0.82rem;color:var(--gris);margin:0 0 12px;line-height:1.5;}
  .provenance b{color:var(--encre);font-weight:600;}
  .statut{font-size:0.82rem;color:var(--gris);margin:0;padding-top:12px;border-top:1px solid var(--filet);}
  .chiffre{
    font-weight:700;
    background-image:linear-gradient(var(--surligneur),var(--surligneur));
    background-repeat:no-repeat;background-position:0 88%;background-size:0 42%;
    transition:background-size .5s ease .15s;padding:0 1px;
  }
  .fiche.vue .chiffre{background-size:100% 42%;}

  /* options */
  fieldset{border:0;margin:0;padding:0;}
  legend{padding:0;}
  .options{display:grid;gap:10px;}
  .option{
    display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;
    border:1px solid var(--filet);padding:14px 16px;cursor:pointer;
  }
  .option:hover{border-color:var(--brique);}
  .option input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--brique);}
  .option:has(input:checked){border-color:var(--brique);background:var(--brique-clair);}
  .option:has(input:focus-visible){outline:3px solid var(--brique);outline-offset:2px;}
  .option b{display:block;font-weight:600;}
  .option em{display:block;font-style:normal;font-size:0.9rem;color:var(--gris);margin-top:2px;}

  textarea{
    width:100%;font:inherit;padding:12px 14px;border:1px solid var(--filet);
    background:var(--blanc);color:var(--encre);resize:vertical;min-height:92px;
  }
  textarea:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}

  button{
    font:inherit;font-weight:600;color:var(--blanc);background:var(--brique);
    border:0;padding:13px 24px;cursor:pointer;
  }
  button:hover{background:#6317123e;}
  button:disabled{background:#bdb6c6;cursor:not-allowed;}
  button:focus-visible{outline:3px solid var(--encre);outline-offset:3px;}
  .secondaire{background:var(--blanc);color:var(--brique);border:1px solid var(--brique);}
  .secondaire:hover{background:var(--brique-clair);}
  .barre{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}

  .retour{margin-top:24px;padding:20px 22px;background:var(--brique-clair);border-left:4px solid var(--brique);}
  .retour ul{margin:0 0 12px;padding-left:20px;}
  .retour li{margin-bottom:5px;}
  .retour p:last-child,.reel p:last-child,.nom p:last-child{margin-bottom:0;}
  .reel{margin-top:24px;border-left:4px solid var(--surligneur);padding:4px 0 4px 20px;}
  .nom{margin-top:24px;border:1px solid var(--encre);padding:20px 22px;}
  .nom p{max-width:60ch;}
  .terme{
    background-image:linear-gradient(var(--surligneur),var(--surligneur));
    background-repeat:no-repeat;background-position:0 85%;background-size:100% 40%;
    font-weight:700;padding:0 2px;
  }
  .piece{margin-top:24px;border:1px solid var(--encre);padding:20px 22px;}
  .piece blockquote{margin:0;padding-left:16px;border-left:3px solid var(--surligneur);}
  .maquette{
    margin-top:22px;border:1px dashed var(--gris);padding:18px 20px;
    font-size:0.92rem;color:var(--gris);
  }
  .maquette b{color:var(--encre);}

  /* tri en deux colonnes */
  .ligne{border:1px solid var(--filet);padding:16px 18px;margin-bottom:10px;}
  .ligne .q{font-weight:600;margin:0 0 12px;}
  .ligne .choix{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .ligne .choix .fleche-droite{margin-left:auto;}
  .ligne .verdict{margin:12px 0 0;font-size:0.9rem;padding-top:12px;border-top:1px solid var(--filet);}
  .ligne.repondu{background:var(--brique-clair);margin-bottom:12px;}
  .ligne.repondu.correct{border-left:4px solid var(--brique);}
  .ligne.repondu.incorrect{border-left:4px solid var(--gris);}
  .ligne .juste{color:var(--brique);font-weight:600;}
  .petit{font-size:0.9rem;padding:9px 14px;}

  .tri-banque{display:grid;gap:10px;margin-bottom:24px;}
  .tri-colonnes{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .tri-colonnes .colonne{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:16px 18px;min-height:70px;}
  .tri-colonnes .colonne h3{font-size:0.95rem;margin:0 0 14px;}
  .tri-colonnes .colonne .vide{color:var(--gris);font-size:0.88rem;font-style:italic;margin:0;}
  @media (max-width:760px){.tri-colonnes{grid-template-columns:1fr;}}

  /* budget de questions */
  .compteur{
    display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
    margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--filet);
  }
  .compteur strong{font-size:1.05rem;}
  .qlist{display:grid;gap:10px;}
  .qbtn{
    text-align:left;width:100%;background:var(--blanc);color:var(--encre);
    border:1px solid var(--filet);padding:14px 16px;font-weight:400;
  }
  .qbtn:hover:not(:disabled){border-color:var(--brique);background:var(--brique-clair);}
  .qbtn:disabled{background:var(--brique-clair);color:var(--gris);cursor:default;}
  .qbtn .reponse{display:block;margin-top:8px;font-size:0.9rem;color:var(--encre);}

  /* pièces du documentaire */
  .piece-doc{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:20px;margin-bottom:14px;}
  .piece-doc.ouverte{border-top-color:var(--brique);}
  .piece-doc h4{margin:0 0 8px;font-size:0.98rem;font-weight:700;}
  .piece-doc .corps{margin-top:12px;}
  .avertissement{
    border:1px solid var(--encre);padding:18px 20px;margin-top:22px;font-size:0.94rem;
  }
  .avertissement h4{margin:0 0 8px;font-size:0.95rem;font-weight:700;}

  a{color:var(--brique);text-decoration:underline;text-underline-offset:3px;}
  a:hover{text-decoration-thickness:2px;}
  a:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}
  .ext{color:var(--gris);font-size:0.78rem;white-space:nowrap;}
  .renvoi{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--filet);font-size:0.85rem;line-height:1.8;}

  /* une */
  .une{border:2px solid var(--encre);padding:28px 30px;margin-top:8px;}
  .une .bandeau{
    font-size:0.8rem;color:var(--gris);padding-bottom:12px;margin-bottom:20px;
    border-bottom:1px solid var(--filet);
  }
  .une .titre-une{font-size:1.7rem;line-height:1.15;letter-spacing:-0.025em;font-weight:700;margin:0 0 14px;}
  .une .chapo-une{font-size:1.02rem;margin:0 0 24px;}
  .une .interieures{border-top:1px solid var(--filet);padding-top:18px;display:grid;gap:16px;}
  .une .interieures h4{margin:0 0 6px;font-size:0.95rem;font-weight:700;}
  .une .interieures p{margin:0;font-size:0.92rem;color:var(--gris);}
  .une .coupees{margin-top:22px;padding-top:14px;border-top:1px solid var(--filet);font-size:0.85rem;color:var(--gris);}
  .une .suite{margin-top:24px;padding-top:18px;border-top:1px solid var(--filet);}
  .une .suite h4{margin:0 0 12px;font-size:0.85rem;font-weight:700;color:var(--gris);}
  .une .breve{margin-bottom:12px;font-size:0.9rem;}
  .une .breve b{display:block;font-weight:700;}
  .une .breve span{color:var(--gris);}

  /* chemin de fer */
  .rangs{list-style:none;margin:0;padding:0;counter-reset:r;}
  .rang{
    display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;
    border:1px solid var(--filet);padding:14px 16px;margin-bottom:10px;
  }
  .rang.tete{border-color:var(--brique);background:var(--brique-clair);}
  .rang .place{font-size:0.78rem;color:var(--gris);font-weight:600;}
  .rang.tete .place{color:var(--brique);}
  .rang .titre-rang{font-weight:600;line-height:1.35;}
  .rang .actions{display:flex;gap:8px;}
  .rang .actions button{min-width:44px;font-size:1rem;line-height:1;}

  @media (max-width:760px){
    .rang{grid-template-columns:1fr auto;gap:8px 12px;}
    .rang .place{grid-column:1 / -1;}
  }

  .lien-discret{
    background:none;border:0;padding:0;color:var(--gris);
    text-decoration:underline;text-underline-offset:3px;font-size:0.85rem;cursor:pointer;
  }
  .lien-discret:hover{color:var(--encre);}
  .lien-discret:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}

  [hidden]{display:none !important;}

  @media (max-width:760px){
    .cartes{grid-template-columns:1fr;}
    .sources{grid-template-columns:1fr;}
    body{padding:22px 16px 48px;}
  }
  @media (prefers-reduced-motion:reduce){.chiffre{transition:none;}}
  @media print{
    .noprint{display:none !important;}
    body{padding:0;}
    .une{border:0;padding:0;}
  }
</style>
</head>
<body>
<main class="feuille" id="app"></main>

<script>
(function(){
"use strict";

var ENQUETES = [

  {
    id:'anthropo',
    axe:'aval',
    titre:'Ils ont pleuré la disparition d\'un logiciel',
    chapeau:'Août 2025, février 2026 : deux fois, des utilisateurs se sont mobilisés pour un modèle.',
    commande:'Vous allez regarder ce que peut produire le ton d\'un modèle sur ses utilisateurs.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant de commencer',
      paras:[
        'Un modèle de langage produit, mot après mot, une suite plausible par rapport à un contexte donné (les prompts en général). Il n\'a ni intention, ni mémoire entre deux conversations, ni état intérieur. Rien de ce qu\'il écrit ne correspond à quelque chose qu\'il éprouve.',
        'Son ton, en revanche, est un choix. Le « je », la chaleur, la disponibilité permanente, la manière de vous donner raison ont été décidés par quelqu\'un, et peuvent être modifiés du jour au lendemain.',
        'Vous allez constater ce que peut produire le ton d\'un modèle sur ses utilisateurs.'
      ]
    },
    mecanique:'documentaire',
    retournement:true,
    aConstruire:'Documentaire en deux temps : le retrait de GPT-4o (août 2025, février 2026), puis Replika (février 2023). Parallèle ELIZA. Mention sobre du cas grave en clôture, avec avertissement et ressources.',
    nomination:{
      titre:'Ce réflexe a un nom, et soixante ans',
      terme:'anthropomorphisation',
      paras:[
        'On appelle <span class="terme">anthropomorphisation</span> le fait de prêter à une machine des intentions, des émotions ou une compréhension qu\'elle n\'a pas. Joseph Weizenbaum l\'observait dès 1966 chez les utilisateurs d\'ELIZA.',
        'Ce n\'est donc ni une faiblesse individuelle ni un effet de la nouveauté : c\'est un réflexe cognitif ordinaire, que la conception des systèmes actuels amplifie délibérément.',
        'Sa conséquence pratique n\'est pas de croire que la machine est vivante car presque personne ne le croit. Elle est de lui accorder une confiance, et une place, que l\'on n\'accorderait pas à un outil.'
      ]
    },
    piece:'Prêter une intention à une machine est un réflexe documenté depuis 1966. Les systèmes actuels ne le corrigent pas, ils l\'amplifient et la relation qu\'ils créent reste un paramètre que l\'entreprise peut modifier ou supprimer.',
    sources:[
      {libelle:'TechCrunch, 13 février 2026', url:'https://techcrunch.com/2026/02/13/openai-removes-access-to-controversial-chatgpt-4o-model'},
      {libelle:'TechCrunch, 3 février 2023 (Replika)', url:'https://techcrunch.com/2023/02/03/replika-italy-data-processing-ban/'}
    ]
  },

  {
    id:'manipulation',
    axe:'aval',
    titre:'Le faux n\'est plus le problème',
    chapeau:'Un contenu circule. Vous avez cinq questions pour décider s\'il tient.',
    commande:'Vous ne pourrez pas trancher en regardant le contenu. Posez les bonnes questions à la rédaction.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant d\'enquêter',
      paras:[
        'Produire un texte, une image, une voix ou une vidéo relève aujourd\'hui du même geste et des mêmes outils. Quelques secondes d\'enregistrement suffisent à cloner une voix, quelques lignes de texte suffisent à copier un style de rédaction, et une photo floue suffit à reproduire un visage.',
        'Les indices de fabrication que l\'on apprend à repérer (incohérences visuelles, voix robotique, tirets cadratin, etc.) disparaissent avec chaque nouveau modèle, et aucun outil de détection ne peut garantir des réponses fiables .',
        'Ce qui reste vérifiable n\'est pas le contenu, mais son parcours. Vous disposez d\'un nombre limité de questions à poser à la rédaction pour mener votre enquête.'
      ]
    },
    mecanique:'budget',
    aConstruire:'Budget de questions limité. L\'apprenant dépense ses questions entre examen du contenu (sans résultat exploitable) et remontée de provenance (qui publie en premier, source indépendante, amplification, financement). Le constat est produit par la dépense, pas énoncé.',
    nomination:{
      titre:'Le mécanisme que vous avez déjoué a un nom',
      terme:'manipulation de l\'information',
      paras:[
        'En retraçant le parcours d\'un contenu : qui l\'a publié le premier, à quelle date, à partir de quoi, qui l\'a repris, qui a financé sa diffusion vous avez déjoué une tentative de <span class="terme">manipulation de l\'information.</span>',
        'L\'étude de la provenance d\'un contenu est le seul élément qui résiste au progrès des outils génération, parce qu\'il ne dépend pas de la qualité du faux et par conséquent le seul rempart face à la manipulation de l\'information.' ,
        'VIGINUM, le service de l\'État chargé de la surveillance des ingérences numériques étrangères, procède exactement ainsi. Ses rapports publics documentent les réseaux de diffusion et les circuits de rémunération plutôt que les caractéristiques techniques des contenus.'
      ]
    },
    piece:'Aucun examen du contenu ne permet de trancher. Seul son parcours : qui publie, quand, à partir de quoi, qui amplifie et qui finance, reste vérifiable.',
    sources:[
      {libelle:'VIGINUM, rapport technique Storm-1516, mai 2025', url:'https://www.sgdsn.gouv.fr/files/2025-05/20250507_TLP-CLEAR_NP_SGDSN_VIGINUM_Rapport%20technique_Storm-1516.pdf'}
    ]
  },

  {
    id:'atrophie',
    axe:'aval',
    titre:'Partenaire ou substitut ?',
    chapeau:'Déléguer n\'est pas le problème. Ce qui compte, c\'est ce qu\'on garde la capacité de vérifier.',
    commande:'Triez 6 situations selon si la capacité de vérifier est conservée, ou si elle a, elle aussi, été déléguée.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant de trier',
      paras:[
        'Confier une opération mentale à un outil extérieur n\'a rien de nouveau : une liste de courses, une calculatrice, un moteur de recherche, ils nous permettent de déléguer certaines tâches pour gagner du temps ou tout simplement pour nous simplifier la vie.',
        'Ce qui varie avec l\'intelligence artificielle générative, c\'est ce qui se passe ensuite : reste-t-on capable de vérifier, de corriger, de repérer une erreur dans ce que l\'outil a produit ? Ou ces compétences sont elles aussi déléguées ?',
        'Voici 6 situations de travail avec un modèle de langage. Pour chacune, il faut trancher sur ce qui se produit.'
      ]
    },
    mecanique:'titres',
    nomination:{
      titre:'Ce que plusieurs travaux tentent d\'isoler',
      terme:'déchargement cognitif',
      paras:[
        'On appelle <span class="terme">déchargement cognitif</span> le fait de confier à un support extérieur une opération mentale : une liste de courses, une calculatrice, un moteur de recherche, un modèle de langage. Le phénomène est ancien et largement documenté, par exemple, un affaiblissement de la mémoire spatiale a été constaté chez les usagers de GPS lorsque cette technologie est arrivée sur le marché.',
        'Ce que plusieurs travaux récents cherchent à isoler, ce sont les processus précis qui s\'affaiblissent quand la délégation devient systématique : l\'abstraction, la répétition mentale, la régulation métacognitive, c\'est-à-dire la capacité à évaluer soi-même la fiabilité de ce qu\'on produit. Le critère utile n\'est donc pas de savoir si l\'on délègue, mais si l\'on conserve cette dernière capacité.',
        'Rien n\'indique que ce risque soit irréversible : le cerveau reste plastique, et se réengage dès qu\'on lui en laisse l\'occasion. Ce domaine de recherche est encore jeune et ses méthodes inégales et les prochaines années trancheront davantage que les six situations que vous venez de trier.'
      ]
    },
    piece:'Un outil reste un partenaire tant qu\'il élargit une capacité qu\'on continue d\'exercer ; il devient un substitut dès qu\'il la remplace.',
    sources:[
      {libelle:'Ioan Roxin, Polytechnique Insights, 3 juillet 2025', url:'https://www.polytechnique-insights.com/tribunes/neurosciences/ia-generative-le-risque-de-latrophie-cognitive/'},
      {libelle:'Arya Jadhav, « Distributed Atrophy 2.0 », préprint 2025', url:'https://www.researchgate.net/publication/394026188_Distributed_Atrophy_20_Cognitive_Offloading_and_the_Reshaping_of_Thought'},
      {libelle:'L\'étude, MIT Media Lab', url:'https://www.media.mit.edu/publications/your-brain-on-chatgpt/'},
      {libelle:'Lee et al., Microsoft Research & Carnegie Mellon, CHI 2025', url:'https://doi.org/10.1145/3706598.3713778'}
    ]
  }

];

var etat = {
  consigne:'',
  faites:{},
  ordreFait:[],
  ordre:[]
};

var app = document.getElementById('app');

// Bouton "Retour à l'accueil" présent en tête des pages d'activité (cf. enTete()) :
// délégué une seule fois sur le conteneur, qui survit aux ré-affichages successifs.
app.addEventListener('click', function(ev){
  var nav = ev.target.closest('.nav-accueil');
  if (nav) vueHub();
});

function trouver(id){
  for (var i=0;i<ENQUETES.length;i++){ if (ENQUETES[i].id===id) return ENQUETES[i]; }
  return null;
}
function nbFaites(){ return Object.keys(etat.faites).length; }
function echap(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function liens(sources){
  if (!sources || !sources.length) return '';
  var h = '<p class="renvoi">Vérifier par vous-même&nbsp;:<br>';
  sources.forEach(function(s){
    h += '<a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.libelle+' <span class="ext">(nouvelle fenêtre)</span></a><br>';
  });
  return h + '</p>';
}
function defiler(el){
  if (el && typeof el.scrollIntoView === 'function'){
    try { el.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch (err) { el.scrollIntoView(); }
  }
}
function afficher(html, focusSel){
  app.innerHTML = html;
  var cible = app.querySelector(focusSel || 'h1');
  if (cible){ cible.setAttribute('tabindex','-1'); cible.focus(); }
  window.scrollTo(0,0);
}


/* ---------- 1. prise de poste ---------- */

function vueAccueil(){
  afficher(
    '<div class="commande">'
  + '<h1>Les coulisses de l\'IA, l\'enquête 2/2</h1>'
  + '<p class="large">Vous êtes journaliste d\'investigation. Ce second dossier s\'intéresse à ce qui se joue une fois qu\'un modèle d\'IA générative existe : la confiance qu\'on lui accorde, ce qu\'il laisse circuler, ce qu\'il déplace chez ceux qui s\'en servent.</p>'
  + '<p class="large gris">Trois enquêtes, dans l\'ordre de votre choix. Chacune s\'appuie sur des faits réels, datés et vérifiables, que vous pouvez consulter à tout moment. Une seule chose est évaluée : votre méthode, jamais votre jugement.</p>'
  + '</div>'
  + '<div class="barre"><button type="button" id="entrer">Prendre mon poste</button></div>'
  );

/* ---------- 2. salle de rédaction ---------- */

function carte(e){
  var fait = !!etat.faites[e.id];
  return '<button type="button" class="carte'+(fait?' fait':'')+'" data-id="'+e.id+'">'
       + '<span class="titre">'+e.titre+'</span>'
       + '<span class="chapeau">'+e.chapeau+'</span>'
       + '<span class="etat">'+(fait?'Versée au dossier':'À enquêter')+'</span>'
       + '</button>';
}

function vueHub(){
  var n = nbFaites(), total = ENQUETES.length;
  var h = '<div class="commande"><h1>Salle de rédaction</h1>'
        + (etat.reprise ? '<p class="large gris">Vous reprenez ce dossier là où vous l\'aviez laissé.</p>' : '')
        + '</div>'
        + '<div class="avancement"><strong>'+n+' volet'+(n>1?'s':'')+' sur '+total+' au dossier</strong>'
        + '<span class="gris">'+(n>=SEUIL_BOUCLAGE?'Le numéro peut être bouclé.':'Le bouclage s\'ouvre à partir de '+SEUIL_BOUCLAGE+' volets versés.')+'</span></div>'
        + '<section class="axe"><h2>Ce qui se joue avec nous</h2><div class="cartes">'
        + ENQUETES.map(carte).join('') + '</div></section>'
        + '<div class="barre"><button type="button" id="boucler"'+(n<SEUIL_BOUCLAGE?' disabled':'')+'>Boucler le numéro</button></div>'
        + '<p class="gris" style="margin-top:14px"><button type="button" id="recommencer" class="lien-discret">Recommencer ce dossier à zéro</button></p>';

  afficher(h);
  app.querySelectorAll('.carte').forEach(function(b){
    b.addEventListener('click', function(){ vueEnquete(b.dataset.id); });
  });
  document.getElementById('boucler').addEventListener('click', vueBouclage);
  document.getElementById('recommencer').addEventListener('click', function(){
    if (window.confirm('Effacer votre progression sur ce dossier et repartir de zéro ?')){
      effacerSauvegarde();
      etat.faites = {}; etat.ordreFait = []; etat.ordre = []; etat.consigne = ''; etat.reprise = false;
      vueAccueil();

/* ---------- 3. enquête ---------- */

function enTete(e){
  return '<div class="commande">'
       + '<button type="button" class="nav-accueil">← Retour à l\'accueil</button>'
       + '<h1>'+e.titre+'</h1><p class="large">'+e.commande+'</p></div>'
       + '<section class="amorce"><h2>'+e.amorce.titre+'</h2>'
       + e.amorce.paras.map(function(p){return '<p>'+p+'</p>';}).join('') + '</section>';
}

function blocNomination(e){
  return '<div class="nom"><h3>'+e.nomination.titre+'</h3>'
       + e.nomination.paras.map(function(p){return '<p>'+p+'</p>';}).join('')
       + liens(e.sources) + '</div>';
}

function blocPiece(e){
  return '<div class="piece"><h3>Pièce versée au dossier</h3>'
       + '<blockquote>'+e.piece+'</blockquote></div>';
}

function cloture(e){
  var zone = document.getElementById('cloture');
  zone.innerHTML = blocNomination(e) + blocPiece(e)
    + '<div class="barre"><button type="button" id="retour">Retour à la rédaction</button></div>';
  etat.faites[e.id] = true;
  if (etat.ordreFait.indexOf(e.id) === -1) etat.ordreFait.push(e.id);
  sauvegarder();
  var t = zone.querySelector('.nom h3');
  t.setAttribute('tabindex','-1');
  t.focus();
  document.getElementById('retour').addEventListener('click', vueHub);
  defiler(zone);
}

function vueEnquete(id){
  var e = trouver(id);
  var table = {
    documentaire:  mecDocumentaire,
    budget:        mecBudget,
    titres:        mecTitres
  };
  (table[e.mecanique] || mecMaquette)(e);
}

function mecMaquette(e){
  afficher(enTete(e)
    + '<section class="etape"><p class="consigne">Mécanique non définie pour cet enjeu.</p></section>');
}

];

function mecBudget(e){
  var reste = BUDGET, depenseContenu = 0, depenseProv = 0;

  function majCompteur(){
    document.getElementById('reste').textContent = reste;
  }

  afficher(enTete(e)
  + '<section class="etape"><h2>Le contenu</h2>'
  + '<div class="fiche"><p>Une vidéo de 38 secondes circule depuis hier soir. '
  + 'On y voit une personnalité publique tenir des propos qu\'elle n\'a jamais tenus publiquement. '
  + 'La qualité est excellente, la voix est juste, rien ne cloche à l\'écran.</p>'
  + '<p class="statut">La rédaction doit trancher avant la conférence de midi.</p></div></section>'
  + '<section class="etape"><h2>Vos questions</h2>'
  + '<div class="compteur"><strong>Crédits restants : <span id="reste">'+BUDGET+'</span></strong>'
  + '<span class="gris">Chaque question consomme un crédit.</span></div>'
  + '<div class="qlist">'
  + PISTES.map(function(p,i){
      return '<button type="button" class="qbtn" data-i="'+i+'">'+p.q+'</button>';
    }).join('')
  + '</div><div id="cloture" aria-live="polite"></div></section>');

  app.querySelectorAll('.qbtn').forEach(function(b){
    b.addEventListener('click', function(){
      if (reste <= 0 || b.disabled) return;
      var p = PISTES[+b.dataset.i];
      reste--;
      if (p.type === 'contenu') depenseContenu++; else depenseProv++;
      b.disabled = true;
      b.innerHTML = b.textContent + '<span class="reponse">' + p.r + '</span>';
      majCompteur();

      if (reste === 0){
        app.querySelectorAll('.qbtn').forEach(function(x){ x.disabled = true; });
        var verdict;
        if (depenseProv >= 4){
          verdict = '<p>Vous avez presque tout misé sur le parcours du contenu, et vous avez de quoi publier : '
            + 'un compte sans histoire, aucune source indépendante, un réseau d\'amplification construit, un démenti vérifiable.</p>';
        } else if (depenseProv >= 2){
          verdict = '<p>Vous avez de quoi douter sérieusement, sans avoir tout à fait de quoi publier. '
            + 'Les questions dépensées sur l\'examen du fichier n\'ont rien rapporté, c\'était prévisible, et c\'est le point de cette enquête.</p>';
        } else {
          verdict = '<p>Vous avez dépensé l\'essentiel de votre budget à examiner le contenu lui-même, et vous n\'avez rien. '
            + 'Ce n\'est pas une faute d\'attention : c\'est le réflexe que l\'on nous a appris, et il ne fonctionne plus.</p>';
        }
        var avant = '<div class="retour"><h3>Ce que vous avez obtenu</h3>'
          + '<p>' + depenseContenu + ' question' + (depenseContenu>1?'s':'') + ' sur l\'examen du contenu, '
          + depenseProv + ' sur son parcours.</p>' + verdict
          + '<p>Aucune des trois premières pistes ne pouvait aboutir. L\'examen du fichier ne tranche plus, '
          + 'et les outils de détection donnent des résultats que l\'on ne peut pas opposer à quiconque.</p></div>';
        cloturePartielle(e, avant);
      }
    });
  });
}

function mecTitres(e){
  afficher(enTete(e)
  + '<section class="etape"><h2>Le critère qui compte</h2>'
  + '<p class="consigne">Cochez les situations où, selon vous, la capacité de vérifier a été perdue en cours de route.</p>'

      + '<p>Certaines études commencent à explorer cette question, à des degrés de solidité inégaux. Une étude du MIT Media Lab '
      + '(un préprint, non relu par des pairs) a mesuré une connectivité cérébrale presque divisée par deux chez les rédacteurs assistés '
      + 'par un modèle de langage. Une étude conduite par Microsoft Research et l\'université Carnegie Mellon, présentée à la conférence CHI 2025, '
      + ' a interrogé 319 travailleurs sur 936 situations réelles d\'usage : plus la confiance dans l\'outil grandit, plus le score '
      + 'de pensée critique décline. Cette observation ne peut cependant pas être considérée comme une preuve de cause à effet.</p>'
      + '<p>Un préprint plus récent, signé Arya Jadhav, propose d\'appeler ce phénomène une "atrophie distribuée". Il cible trois processus cognitifs précis : l\'abstraction, '

      + 'L\'IA générative amplifierait donc un mécanisme déjà connu plutôt qu\'elle n\'en inventerait un nouveau. La même étude souligne d\'ailleurs que le cerveau '
      + 'reste plastique et est donc capable de se réengager dès qu\'on lui en laisse l\'occasion.</p>'

    document.getElementById('valider').disabled = true;
    document.getElementById('valider').textContent = 'Mesure affichée';

  });
}

/* mécanique de secours — utilisée si une mécanique n'est pas encore écrite */

    var msg;
    if (!etat.consigne){

      msg = 'Vous avez employé une formule d\'adresse ou de politesse'+(vous?', et vous avez vouvoyé':'')+'. C\'est un réflexe social, adressé à un système qui n\'en perçoit rien. Personne ne dit « s\'il te plaît » à un tableur.';
    } else {
      msg = 'Vous avez formulé une instruction sans marque d\'adresse. C\'est plus rare qu\'on ne croit, et cela ne vous met pas à l\'abri : le reste de cette enquête porte sur des personnes qui savaient parfaitement à quoi elles parlaient.';
    }
    document.getElementById('analyse').textContent = msg;
  }

  document.getElementById('verser').addEventListener('click', function(){
    this.disabled = true; this.textContent = 'Versé';
    cloture(e);
  });
}

/* ---------- 4. bouclage ---------- */

function vueBouclage(){
  if (!etat.ordre.length) etat.ordre = etat.ordreFait.slice();
  etat.ordreFait.forEach(function(id){
    if (etat.ordre.indexOf(id) === -1) etat.ordre.push(id);
  });

  afficher('<div class="commande"><h1>Boucler le dossier</h1>'
  + '<p class="large">Les volets versés paraissent. Reste à décider dans quel ordre.</p>'
  + '<p class="large gris">Le premier fera la une'+(etat.ordre.length>1?', le reste les pages intérieures':'')+'. '
  + 'Aucun ordre n\'est le bon : celui-ci est le vôtre et n\'est pas évalué.</p></div>'
  + '<section class="etape"><h2>Votre chemin de fer</h2>'
  + '<p class="consigne">Les volets sont d\'abord rangés dans l\'ordre où vous les avez menés. Déplacez-les jusqu\'à l\'ordre de parution voulu.</p>'
  + '<ol class="rangs" id="rangs"></ol>'
  + '<div class="barre"><button type="button" id="publier">Publier</button>'
  + '<button type="button" class="secondaire" id="revenir">Revenir à la rédaction</button></div>'
  + '<p class="gris" id="annonce" aria-live="polite" style="margin-top:14px"></p></section>');

  dessinerRangs(null);
  document.getElementById('publier').addEventListener('click', vueUne);
  document.getElementById('revenir').addEventListener('click', vueHub);
}

function placeDe(i){
  return i === 0 ? 'Une' : 'Pages intérieures';
}

function dessinerRangs(refocus){
  var ol = document.getElementById('rangs');
  ol.innerHTML = etat.ordre.map(function(id, i){
    var e = trouver(id);
    return '<li class="rang'+(i===0?' tete':'')+'">'
         + '<span class="place">'+placeDe(i)+'</span>'
         + '<span class="titre-rang">'+e.titre+'</span>'
         + '<span class="actions">'
         + '<button type="button" class="secondaire petit deplacer" data-id="'+id+'" data-sens="-1"'+(i===0?' disabled':'')+' aria-label="Monter : '+e.titre+'">↑</button>'
         + '<button type="button" class="secondaire petit deplacer" data-id="'+id+'" data-sens="1"'+(i===etat.ordre.length-1?' disabled':'')+' aria-label="Descendre : '+e.titre+'">↓</button>'
         + '</span></li>';
  }).join('');

  ol.querySelectorAll('.deplacer').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.id, sens = +b.dataset.sens;
      var i = etat.ordre.indexOf(id), j = i + sens;
      if (j < 0 || j >= etat.ordre.length) return;
      etat.ordre[i] = etat.ordre[j];
      etat.ordre[j] = id;
      dessinerRangs({id:id, sens:sens});
      var e = trouver(id);
      document.getElementById('annonce').textContent = '"'+e.titre +'"'+ ' désormais en position ' + (j+1) + ' : ' + placeDe(j) + '.';
    });
  });

  if (refocus){
    var cible = ol.querySelector('.deplacer[data-id="'+refocus.id+'"][data-sens="'+refocus.sens+'"]');
    if (cible && !cible.disabled) cible.focus();
    else {
      var autre = ol.querySelector('.deplacer[data-id="'+refocus.id+'"]:not([disabled])');
      if (autre) autre.focus();
    }
  }
}

/* ---------- 5. la une ---------- */

function vueUne(){
  var liste = etat.ordre.map(trouver);
  var une = liste[0], ints = liste.slice(1);

  afficher(
    '<div class="commande noprint"><h1>Votre numéro</h1>'
  + '<p class="large gris">'+liste.length+' volet'+(liste.length>1?'s':'')+', dans l\'ordre que vous avez choisi.</p></div>'
  + '<div class="une">'
  + '<p class="bandeau">Les coulisses de l\'IA</p>'
  + '<h2 class="titre-une">'+une.titre+'</h2>'
  + '<p class="chapo-une">'+une.piece+'</p>'
  + (ints.length ? '<div class="interieures">'
      + ints.map(function(e){ return '<div><h4>'+e.titre+'</h4><p>'+e.piece+'</p></div>'; }).join('')
      + '</div>' : '')
  + '</div>'
  + '<div class="barre noprint">'
  + '<button type="button" id="imprimer">Imprimer ou enregistrer en PDF</button>'
  + '<button type="button" class="secondaire" id="refaire">Modifier l\'ordre</button>'
  + '</div>'
  + '<p class="consigne noprint" style="margin-top:22px">'+(liste.length>1
      ? 'La plupart des lecteurs s\'arrêteront au premier volet. Décider de l\'ordre, c\'est décider de ce qui sera lu.'
      : 'Une seule pièce au dossier pour l\'instant. Vous pouvez revenir à la rédaction pour en verser d\'autres avant de publier.')+'</p>'
  );

  document.getElementById('imprimer').addEventListener('click', function(){ window.print(); });
  document.getElementById('refaire').addEventListener('click', vueBouclage);
}

var SEUIL_BOUCLAGE = 2;
var STORAGE_KEY = 'ci_aval_v1';

function sauvegarder(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      faites: etat.faites, ordreFait: etat.ordreFait, consigne: etat.consigne
    }));
  } catch (err) { /* stockage indisponible : la session continue sans persister */ }
}
function chargerSauvegarde(){
  try {
    var brut = localStorage.getItem(STORAGE_KEY);
    if (!brut) return null;
    var data = JSON.parse(brut);
    return (data && typeof data === 'object') ? data : null;
  } catch (err) { return null; }
}
function effacerSauvegarde(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
}

(function demarrer(){
  var sauvegarde = chargerSauvegarde();
  if (sauvegarde && sauvegarde.faites && Object.keys(sauvegarde.faites).length > 0){
    etat.faites = sauvegarde.faites;
    etat.ordreFait = sauvegarde.ordreFait || Object.keys(sauvegarde.faites);
    etat.consigne = sauvegarde.consigne || '';
    etat.reprise = true;
    vueHub();
  } else {
    vueAccueil();
  }
})();

})();
</script>
