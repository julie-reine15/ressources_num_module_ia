<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coulisses IA • l'enquête (1/2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --encre:#1a1420;
    --gris:#575060;
    --brique:#631712;
    --brique-clair:#f7eeed;
    --surligneur:#b2e084;
    --filet:#e4dfe9;
    --blanc:#ffffff;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;padding:28px 20px 64px;
    background:var(--blanc);color:var(--encre);
    font-family:'Montserrat','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.6;
  }
  .feuille{max-width:920px;margin:0 auto;}

  h1{font-size:1.5rem;line-height:1.2;letter-spacing:-0.02em;font-weight:700;margin:0 0 12px;}
  h2{font-size:1.05rem;font-weight:700;margin:0 0 8px;letter-spacing:-0.01em;}
  h3{font-size:1rem;font-weight:700;margin:0 0 10px;}
  p{margin:0 0 12px;}
  .large{max-width:62ch;}
  .gris{color:var(--gris);}

  .commande{border-left:4px solid var(--brique);padding:2px 0 2px 18px;margin:0 0 32px;}
  .commande p:last-child{margin-bottom:0;}

  .nav-accueil{
    display:inline-block;background:none;border:0;padding:0;margin:0 0 14px;
    font:inherit;font-size:0.85rem;font-weight:600;color:var(--gris);cursor:pointer;
  }
  .nav-accueil:hover{color:var(--brique);}
  .nav-accueil:focus-visible{outline:3px solid var(--brique);outline-offset:3px;}

  .amorce{margin:0 0 30px;padding:20px 22px;background:var(--brique-clair);}
  .amorce p{max-width:58ch;}
  .amorce p:last-child{margin-bottom:0;}

  .etape{margin:0 0 34px;}
  .consigne{color:var(--gris);max-width:62ch;margin:0 0 18px;}

  /* hub */
  .axe{margin:0 0 30px;}
  .axe > h2{margin-bottom:14px;}
  .cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .carte{
    display:flex;flex-direction:column;align-items:stretch;text-align:left;
    border:1px solid var(--filet);border-top:3px solid var(--encre);
    background:var(--blanc);padding:18px 18px 16px;cursor:pointer;font:inherit;color:inherit;
  }
  .carte:hover{border-color:var(--brique);border-top-color:var(--brique);}
  .carte:focus-visible{outline:3px solid var(--brique);outline-offset:3px;}
  .carte .titre{font-weight:700;line-height:1.3;margin:0 0 8px;}
  .carte .chapeau{font-size:0.88rem;color:var(--gris);margin:0 0 14px;flex:1;}
  .carte .etat{font-size:0.8rem;color:var(--gris);padding-top:10px;border-top:1px solid var(--filet);}
  .carte.fait{border-top-color:var(--brique);background:var(--brique-clair);}
  .carte.fait .etat{color:var(--brique);font-weight:600;}

  .avancement{
    display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;
    margin:0 0 28px;padding-bottom:18px;border-bottom:1px solid var(--filet);
  }
  .avancement strong{font-size:1.05rem;}

  /* fiches sources */
  .sources{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .fiche{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:20px;}
  .fiche.reponse{border-top-color:var(--brique);}
  .provenance{font-size:0.82rem;color:var(--gris);margin:0 0 12px;line-height:1.5;}
  .provenance b{color:var(--encre);font-weight:600;}
  .statut{font-size:0.82rem;color:var(--gris);margin:0;padding-top:12px;border-top:1px solid var(--filet);}
  .chiffre{
    font-weight:700;
    background-image:linear-gradient(var(--surligneur),var(--surligneur));
    background-repeat:no-repeat;background-position:0 88%;background-size:0 42%;
    transition:background-size .5s ease .15s;padding:0 1px;
  }
  .fiche.vue .chiffre{background-size:100% 42%;}

  /* options */
  fieldset{border:0;margin:0;padding:0;}
  legend{padding:0;}
  .options{display:grid;gap:10px;}
  .option{
    display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;
    border:1px solid var(--filet);padding:14px 16px;cursor:pointer;
  }
  .option:hover{border-color:var(--brique);}
  .option input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--brique);}
  .option:has(input:checked){border-color:var(--brique);background:var(--brique-clair);}
  .option:has(input:focus-visible){outline:3px solid var(--brique);outline-offset:2px;}
  .option b{display:block;font-weight:600;}
  .option em{display:block;font-style:normal;font-size:0.9rem;color:var(--gris);margin-top:2px;}

  textarea{
    width:100%;font:inherit;padding:12px 14px;border:1px solid var(--filet);
    background:var(--blanc);color:var(--encre);resize:vertical;min-height:92px;
  }
  textarea:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}

  button{
    font:inherit;font-weight:600;color:var(--blanc);background:var(--brique);
    border:0;padding:13px 24px;cursor:pointer;
  }
  button:hover{background:#6317123e;}
  button:disabled{background:#bdb6c6;cursor:not-allowed;}
  button:focus-visible{outline:3px solid var(--encre);outline-offset:3px;}
  .secondaire{background:var(--blanc);color:var(--brique);border:1px solid var(--brique);}
  .secondaire:hover{background:var(--brique-clair);}
  .barre{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}

  .retour{margin-top:24px;padding:20px 22px;background:var(--brique-clair);border-left:4px solid var(--brique);}
  .retour ul{margin:0 0 12px;padding-left:20px;}
  .retour li{margin-bottom:5px;}
  .retour p:last-child,.reel p:last-child,.nom p:last-child{margin-bottom:0;}
  .reel{margin-top:24px;border-left:4px solid var(--surligneur);padding:4px 0 4px 20px;}
  .nom{margin-top:24px;border:1px solid var(--encre);padding:20px 22px;}
  .nom p{max-width:60ch;}
  .terme{
    background-image:linear-gradient(var(--surligneur),var(--surligneur));
    background-repeat:no-repeat;background-position:0 85%;background-size:100% 40%;
    font-weight:700;padding:0 2px;
  }
  .piece{margin-top:24px;border:1px solid var(--encre);padding:20px 22px;}
  .piece blockquote{margin:0;padding-left:16px;border-left:3px solid var(--surligneur);}
  .maquette{
    margin-top:22px;border:1px dashed var(--gris);padding:18px 20px;
    font-size:0.92rem;color:var(--gris);
  }
  .maquette b{color:var(--encre);}

  /* tri en deux colonnes */
  .ligne{border:1px solid var(--filet);padding:16px 18px;margin-bottom:10px;}
  .ligne .q{font-weight:600;margin:0 0 12px;}
  .ligne .choix{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .ligne .choix .fleche-droite{margin-left:auto;}
  .ligne .verdict{margin:12px 0 0;font-size:0.9rem;padding-top:12px;border-top:1px solid var(--filet);}
  .ligne.repondu{background:var(--brique-clair);margin-bottom:12px;}
  .ligne.repondu.correct{border-left:4px solid var(--brique);}
  .ligne.repondu.incorrect{border-left:4px solid var(--gris);}
  .ligne .juste{color:var(--brique);font-weight:600;}
  .petit{font-size:0.9rem;padding:9px 14px;}

  .tri-banque{display:grid;gap:10px;margin-bottom:24px;}
  .tri-colonnes{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .tri-colonnes .colonne{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:16px 18px;min-height:70px;}
  .tri-colonnes .colonne h3{font-size:0.95rem;margin:0 0 14px;}
  .tri-colonnes .colonne .vide{color:var(--gris);font-size:0.88rem;font-style:italic;margin:0;}
  @media (max-width:760px){.tri-colonnes{grid-template-columns:1fr;}}

  /* budget de questions */
  .compteur{
    display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
    margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--filet);
  }
  .compteur strong{font-size:1.05rem;}
  .qlist{display:grid;gap:10px;}
  .qbtn{
    text-align:left;width:100%;background:var(--blanc);color:var(--encre);
    border:1px solid var(--filet);padding:14px 16px;font-weight:400;
  }
  .qbtn:hover:not(:disabled){border-color:var(--brique);background:var(--brique-clair);}
  .qbtn:disabled{background:var(--brique-clair);color:var(--gris);cursor:default;}
  .qbtn .reponse{display:block;margin-top:8px;font-size:0.9rem;color:var(--encre);}

  /* pièces du documentaire */
  .piece-doc{border:1px solid var(--filet);border-top:3px solid var(--encre);padding:20px;margin-bottom:14px;}
  .piece-doc.ouverte{border-top-color:var(--brique);}
  .piece-doc h4{margin:0 0 8px;font-size:0.98rem;font-weight:700;}
  .piece-doc .corps{margin-top:12px;}
  .avertissement{
    border:1px solid var(--encre);padding:18px 20px;margin-top:22px;font-size:0.94rem;
  }
  .avertissement h4{margin:0 0 8px;font-size:0.95rem;font-weight:700;}

  a{color:var(--brique);text-decoration:underline;text-underline-offset:3px;}
  a:hover{text-decoration-thickness:2px;}
  a:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}
  .ext{color:var(--gris);font-size:0.78rem;white-space:nowrap;}
  .renvoi{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--filet);font-size:0.85rem;line-height:1.8;}

  /* une */
  .une{border:2px solid var(--encre);padding:28px 30px;margin-top:8px;}
  .une .bandeau{
    font-size:0.8rem;color:var(--gris);padding-bottom:12px;margin-bottom:20px;
    border-bottom:1px solid var(--filet);
  }
  .une .titre-une{font-size:1.7rem;line-height:1.15;letter-spacing:-0.025em;font-weight:700;margin:0 0 14px;}
  .une .chapo-une{font-size:1.02rem;margin:0 0 24px;}
  .une .interieures{border-top:1px solid var(--filet);padding-top:18px;display:grid;gap:16px;}
  .une .interieures h4{margin:0 0 6px;font-size:0.95rem;font-weight:700;}
  .une .interieures p{margin:0;font-size:0.92rem;color:var(--gris);}
  .une .coupees{margin-top:22px;padding-top:14px;border-top:1px solid var(--filet);font-size:0.85rem;color:var(--gris);}
  .une .suite{margin-top:24px;padding-top:18px;border-top:1px solid var(--filet);}
  .une .suite h4{margin:0 0 12px;font-size:0.85rem;font-weight:700;color:var(--gris);}
  .une .breve{margin-bottom:12px;font-size:0.9rem;}
  .une .breve b{display:block;font-weight:700;}
  .une .breve span{color:var(--gris);}

  /* chemin de fer */
  .rangs{list-style:none;margin:0;padding:0;counter-reset:r;}
  .rang{
    display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;
    border:1px solid var(--filet);padding:14px 16px;margin-bottom:10px;
  }
  .rang.tete{border-color:var(--brique);background:var(--brique-clair);}
  .rang .place{font-size:0.78rem;color:var(--gris);font-weight:600;}
  .rang.tete .place{color:var(--brique);}
  .rang .titre-rang{font-weight:600;line-height:1.35;}
  .rang .actions{display:flex;gap:8px;}
  .rang .actions button{min-width:44px;font-size:1rem;line-height:1;}

  @media (max-width:760px){
    .rang{grid-template-columns:1fr auto;gap:8px 12px;}
    .rang .place{grid-column:1 / -1;}
  }

  .lien-discret{
    background:none;border:0;padding:0;color:var(--gris);
    text-decoration:underline;text-underline-offset:3px;font-size:0.85rem;cursor:pointer;
  }
  .lien-discret:hover{color:var(--encre);}
  .lien-discret:focus-visible{outline:3px solid var(--brique);outline-offset:2px;}

  [hidden]{display:none !important;}

  @media (max-width:760px){
    .cartes{grid-template-columns:1fr;}
    .sources{grid-template-columns:1fr;}
    body{padding:22px 16px 48px;}
  }
  @media (prefers-reduced-motion:reduce){.chiffre{transition:none;}}
  @media print{
    .noprint{display:none !important;}
    body{padding:0;}
    .une{border:0;padding:0;}
  }
</style>
</head>
<body>
<main class="feuille" id="app"></main>

<script>
(function(){
"use strict";

var ENQUETES = [

  {
    id:'cout',
    axe:'amont',
    titre:'Qui a fabriqué le filtre de ChatGPT ?',
    chapeau:'Deux sources, deux versions des conditions de travail des annotateurs.',
    commande:'Deux sources vous parviennent sur les conditions de travail des annotateurs. Elles ne disent pas la même chose. Votre travail : décider ce qui est publiable.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant de lire',
      paras:[
        'Pour qu\'un modèle refuse de produire des contenus violents ou haineux, il faut d\'abord lui apprendre à les reconnaître. Cela suppose des milliers d\'exemples étiquetés un par un, à la main.',
        'Ce travail est réalisé par des personnes, recrutées par des sociétés sous-traitantes, le plus souvent loin des sièges des entreprises qui conçoivent les modèles.',
        'Deux sources vous parviennent sur leurs conditions de travail.'
      ]
    },
    mecanique:'confrontation',
    nomination:{
      titre:'Ce que vous venez de faire porte un nom',
      terme:'travail de la donnée',
      paras:[
        'On appelle <span class="terme">travail de la donnée</span> l\'ensemble des tâches humaines qui rendent un modèle utilisable : annoter, étiqueter, modérer, corriger. Il est indispensable, massif, et presque toujours absent de la présentation des produits qu\'il permet.',
        'Mais ce que vous venez surtout d\'exercer est ailleurs : face à deux sources qui se contredisent, publier ce que vous pouvez défendre plutôt que ce qui frappe le plus. C\'est le geste que les cinq enquêtes suivantes vous demanderont de refaire.'
      ]
    },
    piece:'Une enquête de TIME du 18 janvier 2023 relève une rémunération de 1,32 à 2 dollars de l\'heure pour les annotateurs employés par Sama pour le compte d\'OpenAI. Sama conteste ces chiffres et avance 1,46 à 3,74 dollars après impôts.',
    sources:[
      {libelle:'L\'enquête de TIME, 18 janvier 2023', url:'https://time.com/6247678/openai-chatgpt-kenya-workers/'},
      {libelle:'La réponse de Sama', url:'https://www.business-humanrights.org/en/latest-news/openai-and-sama-hired-underpaid-workers-in-kenia-to-filter-toxic-content-for-chatgpt/'}
    ]
  },

  {
    id:'transparence',
    axe:'amont',
    titre:'Ce qu\'on ne nous dit pas, ce que personne ne sait',
    chapeau:'Deux régimes d\'ignorance qu\'on confond en permanence.',
    commande:'Certaines questions sur un modèle ont une réponse que quelqu\'un détient. D\'autres n\'en ont pour personne. À vous de faire le tri.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant de trier',
      paras:[
        'Le développement d\'un modèle d\'intelligence artificielle générative peut se découper en deux temps. Ces deux temps permettent respectivement d\'apporter des informations concernant la conception du modèle et de comprendre les leviers qui sont actionnés lors de la génération de contenus.',
        'Dans le premier temps, des choix sont faits : la nature des données qui composeront le corpus d\'entrainement, la source de ces données d\'entrainement, qui sera payé pour les annoter et selon quelles règles, déterminer les critères d\'une bonne réponse, quels tests faire passer avant la mise en service. Chacun de ces choix est consigné quelque part dans l\'entreprise, mais rien n\'oblige à les rendre public.',
        'Dans le second temps, le modèle s\'ajuste seul en suivant notamment les choix établis durant le premier temps, des milliards de fois, jusqu\'à devenir les modèles que nous utilisons au quotidien. Ces ajustements ne sont pas une liste de règles qu\'on pourrait ouvrir et lire. Quand le modèle génère une réponse, aucun ingénieur, pas même celui qui l\'a construit, ne peut expliquer ce qui a produit cette réponse plutôt qu\'une autre.',
        'Parmi les questions suivantes, tentez de déduire pour lesquelles des réponses existent et pour lesquelles aucune réponse ne peut être apportée.'
      ]
    },
    mecanique:'tri',
    aConstruire:'Tri en deux colonnes. Une série de questions à répartir entre « la réponse existe mais n\'est pas publiée » et « personne ne peut répondre ». Affectation par boutons, pas de glisser-déposer.',
    nomination:{
      titre:'Deux mots, et une frontière',
      terme:'transparence / explicabilité',
      paras:[
        'La <span class="terme">transparence</span>, c\'est tout ce qu\'on pourrait dire d\'un modèle et qu\'on ne dit pas forcément : les textes qui ont servi à l\'entraîner et la façon dont ils ont été obtenus, les conditions de travail des personnes qui les ont annotés, les comportements récompensés, les évaluations passées avant la mise en service, les incidents survenus depuis. Toutes ces informations existent, sous forme de documents, dans l\'entreprise. La transparence est donc une décision : les publier, ou non.',
        'L\'<span class="terme">explicabilité</span>, c\'est la possibilité de dire pourquoi le modèle a produit cette réponse-là. Elle ne se heurte pas à un refus mais à la nature de l\'objet. Un modèle n\'est pas fait de règles mais de centaines de milliards de nombres ajustés ensemble, et chaque réponse résulte de tous à la fois. Personne ne peut désigner la ligne responsable. L\'entreprise elle-même ne le peut pas.',
        'La conséquence est très concrète : on ne corrige pas un comportement problématique en modifiant l\'endroit fautif, puisqu\'il n\'y en a pas. On réentraîne, on teste, on observe. C\'est exactement ce qui s\'est passé en avril 2025 — vous le verrez, ou vous l\'avez vu, dans l\'enquête sur l\'alignement.'
      ]
    },
    piece:'Ce qu\'on peut savoir d\'un modèle relève de deux régimes distincts : des documents que l\'entreprise détient et publie ou non, et une réponse dont personne, pas même elle, ne peut expliquer la formation.',
    sources:[
      {libelle:'L\'analyse publiée par OpenAI, 29 avril 2025', url:'https://openai.com/index/sycophancy-in-gpt-4o/'}
    ]
  },

  {
    id:'alignement',
    axe:'amont',
    titre:'Le jour où le modèle s\'est mis à tout approuver',
    chapeau:'En avril 2025, un éditeur a retiré une mise à jour quatre jours après l\'avoir déployée. Vous reconstituez ce qui l\'a précédée.',
    commande:'Vous enquêtez sur une décision déjà connue dans ses grandes lignes. Avant de lire comment l\'éditeur l\'explique, vous la reconstituez à sa place.',
    amorce:{
      titre:'Ce qu\'il faut savoir avant de reconstituer',
      paras:[
        'Un modèle de langage n\'est pas programmé règle par règle. On l\'entraîne : il produit des réponses, certaines sont récompensées plutôt que d\'autres, et il finit par produire davantage de ce qui a été récompensé.',
        'Reste à décider ce qui mérite récompense. C\'est une décision humaine, prise par une équipe, et elle porte autant sur le ton du modèle que sur la justesse de ses réponses.',
        'L\'épisode sur lequel vous enquêtez est daté : en avril 2025, un éditeur a modifié le tempérament de son modèle, l\'a retiré quatre jours plus tard, et a publié une explication rare de l\'arbitrage qui y avait conduit. Avant de la lire, reconstituez ce raisonnement.'
      ]
    },
    mecanique:'arbitrage',
    nomination:{
      titre:'Ce que vous venez de faire porte un nom',
      terme:'alignement',
      paras:[
        'On appelle <span class="terme">alignement</span> l\'ensemble des procédés par lesquels on fait correspondre le comportement d\'un modèle aux valeurs et aux intentions de ceux qui le conçoivent.',
        'Ce n\'est ni un réglage technique neutre, ni une propriété acquise une fois pour toutes. C\'est une suite de décisions humaines, prises par des équipes identifiables, révisables — et parfois révisées en quatre jours.',
        'La question n\'est donc jamais de savoir si un modèle est aligné, mais sur quoi, et décidé par qui.'
      ]
    },
    piece:'Le ton par défaut d\'un modèle est un réglage, pas une propriété. En avril 2025, ce réglage a été confié aux retours immédiats des utilisateurs, et retiré quatre jours plus tard.',
    sources:[
      {libelle:'L\'analyse publiée par OpenAI, 29 avril 2025', url:'https://openai.com/index/sycophancy-in-gpt-4o/'},
      {libelle:'TechCrunch, 29 avril 2025', url:'https://techcrunch.com/2025/04/29/openai-explains-why-chatgpt-became-too-sycophantic'}
    ]
  }

];

var etat = {
  consigne:'',
  faites:{},
  ordreFait:[],
  ordre:[]
};

var app = document.getElementById('app');

// Bouton "Retour à l'accueil" présent en tête des pages d'activité (cf. enTete()) :
// délégué une seule fois sur le conteneur, qui survit aux ré-affichages successifs.
app.addEventListener('click', function(ev){
  var nav = ev.target.closest('.nav-accueil');
  if (nav) vueHub();
});

function trouver(id){
  for (var i=0;i<ENQUETES.length;i++){ if (ENQUETES[i].id===id) return ENQUETES[i]; }
  return null;
}
function nbFaites(){ return Object.keys(etat.faites).length; }
function echap(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function liens(sources){
  if (!sources || !sources.length) return '';
  var h = '<p class="renvoi">Vérifier par vous-même&nbsp;:<br>';
  sources.forEach(function(s){
    h += '<a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.libelle+' <span class="ext">(nouvelle fenêtre)</span></a><br>';
  });
  return h + '</p>';
}
function defiler(el){
  if (el && typeof el.scrollIntoView === 'function'){
    try { el.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch (err) { el.scrollIntoView(); }
  }
}
function afficher(html, focusSel){
  app.innerHTML = html;
  var cible = app.querySelector(focusSel || 'h1');
  if (cible){ cible.setAttribute('tabindex','-1'); cible.focus(); }
  window.scrollTo(0,0);
}


/* ---------- 1. prise de poste ---------- */

function vueAccueil(){
  afficher(
    '<div class="commande">'
  + '<h1>Coulisses IA — l\'enquête</h1>'
  + '<p class="large">Vous êtes journaliste d\'investigation. Votre rédaction vous confie un dossier sur ce qui se décide, dans la fabrication d\'un modèle d\'IA générative, sans que personne n\'en soit informé.</p>'
  + '<p class="large gris">Trois enquêtes, dans l\'ordre de votre choix. Chacune s\'appuie sur des faits réels, datés et vérifiables, que vous pouvez consulter à tout moment. Une seule chose est évaluée : votre méthode, jamais votre jugement.</p>'
  + '</div>'
  + '<div class="barre"><button type="button" id="entrer">Prendre mon poste</button></div>'
  );
  document.getElementById('entrer').addEventListener('click', vueHub);
}

/* ---------- 2. salle de rédaction ---------- */

function carte(e){
  var fait = !!etat.faites[e.id];
  return '<button type="button" class="carte'+(fait?' fait':'')+'" data-id="'+e.id+'">'
       + '<span class="titre">'+e.titre+'</span>'
       + '<span class="chapeau">'+e.chapeau+'</span>'
       + '<span class="etat">'+(fait?'Versée au dossier':'À enquêter')+'</span>'
       + '</button>';
}

function vueHub(){
  var n = nbFaites(), total = ENQUETES.length;
  var h = '<div class="commande"><h1>Salle de rédaction</h1>'
        + (etat.reprise ? '<p class="large gris">Vous reprenez ce dossier là où vous l\'aviez laissé.</p>' : '')
        + '</div>'
        + '<div class="avancement"><strong>'+n+' volet'+(n>1?'s':'')+' sur '+total+' au dossier</strong>'
        + '<span class="gris">'+(n>=SEUIL_BOUCLAGE?'Le numéro peut être bouclé.':'Le bouclage s\'ouvre à partir de '+SEUIL_BOUCLAGE+' volets versés.')+'</span></div>'
        + '<section class="axe"><h2>Ce qui se décide sans nous</h2><div class="cartes">'
        + ENQUETES.map(carte).join('') + '</div></section>'
        + '<div class="barre"><button type="button" id="boucler"'+(n<SEUIL_BOUCLAGE?' disabled':'')+'>Boucler le numéro</button></div>'
        + '<p class="gris" style="margin-top:14px"><button type="button" id="recommencer" class="lien-discret">Recommencer ce dossier à zéro</button></p>';

  afficher(h);
  app.querySelectorAll('.carte').forEach(function(b){
    b.addEventListener('click', function(){ vueEnquete(b.dataset.id); });
  });
  document.getElementById('boucler').addEventListener('click', vueBouclage);
  document.getElementById('recommencer').addEventListener('click', function(){
    if (window.confirm('Effacer votre progression sur ce dossier et repartir de zéro ?')){
      effacerSauvegarde();
      etat.faites = {}; etat.ordreFait = []; etat.ordre = []; etat.consigne = ''; etat.reprise = false;
      vueAccueil();
    }
  });
}

/* ---------- 3. enquête ---------- */

function enTete(e){
  return '<div class="commande">'
       + '<button type="button" class="nav-accueil">← Retour à l\'accueil</button>'
       + '<h1>'+e.titre+'</h1><p class="large">'+e.commande+'</p></div>'
       + '<section class="amorce"><h2>'+e.amorce.titre+'</h2>'
       + e.amorce.paras.map(function(p){return '<p>'+p+'</p>';}).join('') + '</section>';
}

function blocNomination(e){
  return '<div class="nom"><h3>'+e.nomination.titre+'</h3>'
       + e.nomination.paras.map(function(p){return '<p>'+p+'</p>';}).join('')
       + liens(e.sources) + '</div>';
}

function blocPiece(e){
  return '<div class="piece"><h3>Pièce versée au dossier</h3>'
       + '<blockquote>'+e.piece+'</blockquote></div>';
}

function cloture(e){
  var zone = document.getElementById('cloture');
  zone.innerHTML = blocNomination(e) + blocPiece(e)
    + '<div class="barre"><button type="button" id="retour">Retour à la rédaction</button></div>';
  etat.faites[e.id] = true;
  if (etat.ordreFait.indexOf(e.id) === -1) etat.ordreFait.push(e.id);
  sauvegarder();
  var t = zone.querySelector('.nom h3');
  t.setAttribute('tabindex','-1');
  t.focus();
  document.getElementById('retour').addEventListener('click', vueHub);
  defiler(zone);
}

function vueEnquete(id){
  var e = trouver(id);
  var table = {
    confrontation: mecConfrontation,
    arbitrage:     mecArbitrage,
    tri:           mecTri
  };
  (table[e.mecanique] || mecMaquette)(e);
}

function mecMaquette(e){
  afficher(enTete(e)
    + '<section class="etape"><p class="consigne">Mécanique non définie pour cet enjeu.</p></section>');
}

/* mécanique A — confrontation de sources */

function mecConfrontation(e){
  afficher(enTete(e)
  + '<section class="etape"><h2>Les deux versions</h2>'
  + '<p class="consigne">Ouvrez les deux fiches avant de continuer.</p>'
  + '<div class="sources">'
  + '<article class="fiche" id="f1">'
  + '<p class="provenance"><b>TIME</b>, enquête de Billy Perrigo<br>18 janvier 2023</p>'
  + '<p>OpenAI a sous-traité à la société Sama, à partir de novembre 2021, l\'annotation de dizaines de milliers d\'extraits destinés à entraîner un filtre de toxicité. Rémunération relevée : <span class="chiffre">1,32 à 2 dollars de l\'heure</span> selon l\'ancienneté. Sama a rompu le contrat en février 2022, huit mois avant son terme.</p>'
  + '<p class="statut">Quatre salariés interrogés sous anonymat, bulletins de paie et documents internes consultés.</p>'
  + '<button type="button" class="ouvrir secondaire" data-cible="f1">Ouvrir la fiche</button></article>'
  + '<article class="fiche reponse" id="f2">'
  + '<p class="provenance"><b>Réponse de Sama</b><br>citée dans la même enquête</p>'
  + '<p>L\'entreprise conteste la charge de travail avancée : 70 passages à annoter par service de neuf heures, et non jusqu\'à 250. Elle avance une rémunération de <span class="chiffre">1,46 à 3,74 dollars de l\'heure</span> après impôts.</p>'
  + '<p class="statut">Déclaration d\'un porte-parole. Aucune pièce produite à l\'appui.</p>'
  + '<button type="button" class="ouvrir secondaire" data-cible="f2">Ouvrir la fiche</button></article>'
  + '</div></section>'
  + '<section class="etape" id="decision" hidden><h2>Ce que vous publiez</h2>'
  + '<p class="consigne">Une seule phrase ira au dossier. Choisissez celle que vous êtes en mesure de défendre.</p>'
  + '<form id="form"><fieldset><legend class="consigne">Quatre formulations possibles :</legend><div class="options">'
  + '<label class="option"><input type="radio" name="choix" value="a"><span>OpenAI a payé ses annotateurs kényans 2 dollars de l\'heure.</span></label>'
  + '<label class="option"><input type="radio" name="choix" value="b"><span>Selon certaines sources, les annotateurs auraient été mal payés.</span></label>'
  + '<label class="option"><input type="radio" name="choix" value="c"><span>Une enquête de TIME du 18 janvier 2023 relève une rémunération de 1,32 à 2 dollars de l\'heure pour les annotateurs employés par Sama pour le compte d\'OpenAI. Sama conteste ces chiffres et avance 1,46 à 3,74 dollars après impôts.</span></label>'
  + '<label class="option"><input type="radio" name="choix" value="d"><span>Le scandale de l\'exploitation des travailleurs du clic par OpenAI a éclaté en 2023.</span></label>'
  + '</div></fieldset><div class="barre"><button type="submit" id="valider" disabled>Verser au dossier</button></div></form>'
  + '<div id="cloture" aria-live="polite"></div></section>');

  var ouvertes = 0;
  app.querySelectorAll('.ouvrir').forEach(function(b){
    b.addEventListener('click', function(){
      var f = document.getElementById(b.dataset.cible);
      f.classList.add('vue'); b.remove(); ouvertes++;
      if (ouvertes===2){
        var d = document.getElementById('decision');
        d.hidden = false;
        d.querySelector('h2').setAttribute('tabindex','-1');
        d.querySelector('h2').focus();
      }
    });
  });

  var retours = {
    a:['Un chiffre contesté présenté comme un fait',['Le chiffre retenu est celui d\'une seule des deux sources.','Aucune attribution : la phrase parle à la place de TIME.','Aucune date, alors que les faits remontent à 2021-2022.']],
    b:['Rien n\'est vérifiable ici',['« Certaines sources » ne désigne personne.','« Mal payés » est une appréciation, pas une donnée.','Le lecteur ne peut ni contrôler ni contester la phrase.']],
    d:['La qualification précède l\'établissement des faits',['« Scandale » et « exploitation » sont des jugements que rien n\'établit à ce stade.','La date renvoie à la publication de l\'enquête, pas aux faits.','La version de Sama disparaît entièrement.']]
  };

  var form = document.getElementById('form');
  var valider = document.getElementById('valider');
  form.addEventListener('change', function(){ valider.disabled = false; });
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var c = form.querySelector('input[name="choix"]:checked').value;
    var h;
    if (c==='c'){
      h = '<div class="retour"><h3>Publiable</h3>'
        + '<p>Cette phrase attribue, date, et rend compte des deux versions sans trancher à la place du lecteur. '
        + 'Elle reste défendable même si Sama produit demain de nouvelles pièces.</p>'
        + '<p>Retenez la méthode plutôt que la phrase : <strong>qui l\'affirme, quand, et qui le conteste</strong>.</p></div>';
    } else {
      h = '<div class="retour"><h3>'+retours[c][0]+'</h3><ul>'
        + retours[c][1].map(function(m){return '<li>'+m+'</li>';}).join('')
        + '</ul><p>La troisième formulation est la seule qui attribue, date et rend compte des deux versions. C\'est elle qui part au dossier.</p></div>';
    }
    valider.disabled = true; valider.textContent = 'Versé';
    cloturePartielle(e, h);
  });
}
function cloturePartielle(e, avant){
  var zone = document.getElementById('cloture');
  zone.innerHTML = avant + blocNomination(e) + blocPiece(e)
    + '<div class="barre"><button type="button" id="retour">Retour à la rédaction</button></div>';
  etat.faites[e.id] = true;
  if (etat.ordreFait.indexOf(e.id) === -1) etat.ordreFait.push(e.id);
  sauvegarder();
  var t = zone.querySelector('h3');
  t.setAttribute('tabindex','-1');
  t.focus();
  document.getElementById('retour').addEventListener('click', vueHub);
  defiler(zone);
}

/* mécanique B — arbitrage avant révélation */

function mecArbitrage(e){
  afficher(enTete(e)
  + '<section class="etape"><h2>La note reconstituée</h2>'
  + '<p class="consigne">Voici, reconstituée à partir de l\'analyse que l\'éditeur a lui-même publiée après coup, la note qui a vraisemblablement circulé avant la décision.</p>'
  + '<div class="fiche"><p>Objectif du trimestre : rendre la personnalité par défaut du modèle plus intuitive et plus efficace dans un plus grand nombre de situations.</p>'
  + '<p>L\'entraînement combine plusieurs signaux de récompense. Un seul a été renforcé.</p>'
  + '<p class="statut">Reconstitution d\'après l\'analyse publiée par l\'éditeur — la décision, elle, a déjà été prise.</p></div>'
  + '<form id="form"><fieldset><legend class="consigne">À leur place, lequel auriez-vous renforcé ?</legend><div class="options">'
  + '<label class="option"><input type="radio" name="signal" value="pouces"><span><b>Les pouces levés et baissés des utilisateurs</b><em>Le signal le plus abondant, et le plus immédiat.</em></span></label>'
  + '<label class="option"><input type="radio" name="signal" value="experts"><span><b>L\'évaluation de la justesse factuelle par des relecteurs externes</b><em>Coûteux, lent, peu de volume.</em></span></label>'
  + '<label class="option"><input type="radio" name="signal" value="duree"><span><b>La durée des conversations</b><em>Facile à mesurer, corrélé à la satisfaction déclarée.</em></span></label>'
  + '<label class="option"><input type="radio" name="signal" value="taches"><span><b>Le taux de tâches menées à terme</b><em>Difficile à définir hors des usages professionnels.</em></span></label>'
  + '</div></fieldset><div class="barre"><button type="submit" id="valider" disabled>Comparer avec la réalité</button></div></form>'
  + '<div id="cloture" aria-live="polite"></div></section>');

  var miroirs = {
    pouces:'Votre hypothèse coïncide avec ce que l\'éditeur a réellement renforcé. La complaisance n\'est pas un accident survenu au modèle : elle est le résultat attendu d\'un arbitrage qui paraissait raisonnable, et que vous venez de reconstituer.',
    duree:'Vous avez supposé un autre indicateur d\'engagement immédiat. Un modèle optimisé sur la durée des échanges a les mêmes raisons qu\'un modèle optimisé sur l\'approbation de vous garder en conversation plutôt que de vous contredire.',
    experts:'Vous avez supposé que le coût et la lenteur avaient été acceptés pour protéger la justesse. C\'est le compromis inverse de celui qui a été fait. Notez ce qu\'il en aurait coûté : moins de données, plus lentement, et un modèle que beaucoup auraient trouvé moins agréable.',
    taches:'Vous avez supposé un signal de performance plutôt que de satisfaction. Il résiste mieux à la complaisance, mais il ne dit rien du ton — et c\'est précisément le ton qui faisait l\'objet de la note.'
  };

  var form = document.getElementById('form');
  var valider = document.getElementById('valider');
  form.addEventListener('change', function(){ valider.disabled = false; });
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var c = form.querySelector('input[name="signal"]:checked').value;
    var avant =
      '<div class="reel"><h3>Ce qui s\'est réellement passé</h3>'
    + '<p>Le 25 avril 2025, OpenAI déploie une mise à jour de GPT-4o destinée à rendre la personnalité par défaut plus intuitive. Quatre jours plus tard, l\'entreprise la retire.</p>'
    + '<p>Dans son analyse publique, elle explique avoir ajouté un signal de récompense fondé sur les pouces levés et baissés des utilisateurs. Ce signal a affaibli celui qui contenait jusque-là la complaisance. Le modèle s\'est mis à valider les doutes et à encourager des décisions impulsives, en cherchant à plaire plutôt qu\'à aider.</p></div>'
    + '<div class="retour"><h3>Votre hypothèse</h3><p>'+miroirs[c]+'</p></div>';
    valider.disabled = true; valider.textContent = 'Hypothèse comparée';
    cloturePartielle(e, avant);
  });
}

/* mécanique C — tri en deux colonnes (transparence / explicabilité) */

var QUESTIONS_TRI = [
  {q:'Quels textes ont servi à entraîner le modèle, et comment ont-ils été obtenus ?',
   r:'detenue', why:'La liste existe : quelqu\'un a constitué ce corpus. Rien n\'oblige à la publier.'},
  {q:'Pourquoi le modèle a-t-il répondu ceci plutôt que cela à une question précise ?',
   r:'personne', why:'Aucun ingénieur ne peut identifier exactement ce qui a produit une réponse.'},
  {q:'Combien de personnes ont annoté les données, et dans quelles conditions de travail ?',
   r:'detenue', why:'Il existe des contrats, des factures, des bulletins de paie.'},
  {q:'Quelle phrase du corpus d\'entraînement a produit cette erreur ?',
   r:'personne', why:'Une réponse résulte de l\'ensemble des paramètres à la fois. On ne peut pas identifier un endroit fautif dans le modèle pour le moment.'},
  {q:'Quels comportements ont été récompensés pendant l\'entraînement ?',
   r:'detenue', why:'Ce sont des décisions documentées en interne.'},
  {q:'Pourquoi refuse-t-il cette demande, et pas une demande presque identique ?',
   r:'personne', why:'Comme on ne peut identifier un espace préci à l\'intérieur du modèle lorsqu\'il génère une réponse, certaines incohérence peuvent ne pas s\'expliquer.'},
  {q:'Quels tests le modèle a-t-il passés avant sa mise en service ?',
   r:'detenue', why:'Les protocoles et les résultats existent sous forme de rapports, souvent publiés pour faire la publicité du modèle.'},
  {q:'Peut-on garantir qu\'une erreur ne se reproduira pas ?',
   r:'personne', why:'Si on ne peut pas identifier ce qui a causé une erreur, il n\'est pas possible de corriger ce qui l\'a causé. Le modèle doit être réentrainé, retester jusqu\'à ce que l\'erreur ne se reproduise plus.'}
];

function mecTri(e){
  var h = enTete(e)
    + '<section class="etape"><h2>Un cas déjà tranché</h2>'
    + '<div class="fiche"><p>Chaque mois, un algorithme calcule un score de risque pour plus de 32 millions de personnes '
    + 'allocataires de la CNAF, l\'organisme qui verse les prestations familiales en France. Pendant des années, '
    + 'l\'organisme a refusé de communiquer son fonctionnement. Sous la pression d\'un recours porté devant le Conseil d\'État, '
    + 'elle a fini par publier le code source de son algorithme en février 2026.</p>'
    + '<p>Résultat : on sait désormais que l\'algorithme existe, et comment il est censé fonctionner. '
    + 'Ce que la publication du code n\'a pas donné, en revanche, c\'est la possibilité de dire à un allocataire précis '
    + 'pourquoi lui a été signalé plutôt qu\'un autre placé dans une situation comparable.</p>'
    + '<p class="statut">Source : La Quadrature du Net, 26 février 2026 — '
    + '<a href="https://www.laquadrature.net/2026/02/26/notation-des-allocataires-la-cnaf-publie-son-code-mais-omet-lessentiel/" target="_blank" rel="noopener noreferrer">'
    + 'lire l\'article <span class="ext">(nouvelle fenêtre)</span></a></p></div>'
    + '<p class="consigne" style="margin-top:18px">Ce cas sépare déjà deux choses qu\'on confond souvent : obtenir le code, '
    + 'et obtenir une explication. Le tri qui suit applique cette même séparation à un modèle de langage.</p></section>'

    + '<section class="etape"><h2>Le tri</h2>'
    + '<p class="consigne">Huit questions que l\'on peut poser au sujet d\'un modèle. Pour chacune, envoyez-la à gauche ou à droite avec la flèche qui correspond.</p>'
    + '<div class="tri-colonnes">'
    + '<div class="colonne" id="col-detenue"><h3>← La réponse existe, détenue par quelqu\'un</h3>'
    + '<div class="colonne-items" id="col-detenue-items"><p class="vide">Rien pour l\'instant.</p></div></div>'
    + '<div class="colonne" id="col-personne"><h3>Personne ne peut répondre →</h3>'
    + '<div class="colonne-items" id="col-personne-items"><p class="vide">Rien pour l\'instant.</p></div></div>'
    + '</div>'
    + '<div class="tri-banque" id="banque">'
    + QUESTIONS_TRI.map(function(item,i){
        return '<div class="ligne" id="l'+i+'"><p class="q">'+item.q+'</p>'
             + '<div class="choix">'
             + '<button type="button" class="secondaire petit fleche-gauche" data-i="'+i+'" data-v="detenue" aria-label="Ranger à gauche : quelqu\'un détient la réponse">← Quelqu\'un détient la réponse</button>'
             + '<button type="button" class="secondaire petit fleche-droite" data-i="'+i+'" data-v="personne" aria-label="Ranger à droite : personne ne peut répondre">Personne ne peut répondre →</button>'
             + '</div></div>';
      }).join('')
    + '</div>'
    + '<div id="cloture" aria-live="polite"></div></section>';

  afficher(h);

  var repondues = 0, justes = 0;

  app.querySelectorAll('#banque .ligne button').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.i, item = QUESTIONS_TRI[i], ligne = document.getElementById('l'+i);
      if (ligne.classList.contains('repondu')) return;
      var bon = (b.dataset.v === item.r);
      if (bon) justes++;
      repondues++;
      ligne.classList.add('repondu', bon ? 'correct' : 'incorrect');
      ligne.querySelector('.choix').remove();
      var p = document.createElement('p');
      p.className = 'verdict';
      p.innerHTML = (bon ? '<span class="juste">Bien trié.</span> ' : '<span class="juste">L\'autre colonne.</span> ') + item.why;
      ligne.appendChild(p);

      // Déplace l'étiquette dans la colonne choisie (pas la colonne correcte) :
      // c'est le tri de l'apprenant, pas une correction automatique de position.
      var cibleId = (b.dataset.v === 'detenue') ? 'col-detenue-items' : 'col-personne-items';
      var cible = document.getElementById(cibleId);
      var vide = cible.querySelector('.vide');
      if (vide) vide.remove();
      cible.appendChild(ligne);

      if (repondues === QUESTIONS_TRI.length){
        var avant = '<div class="retour"><h3>Ce que le tri a séparé</h3>'
          + '<p>'+justes+' questions sur '+QUESTIONS_TRI.length+' rangées du bon côté.</p>'
          + '<p>La colonne de gauche rassemble des informations qui existent, sous forme de documents, chez celui qui a construit le modèle. '
          + 'Les obtenir est une affaire de volonté, de pression publique ou de réglementation — c\'est exactement ce qui a fait céder la CNAF.</p>'
          + '<p>La colonne de droite ne dépend d\'aucune volonté. Même en publiant tout, l\'entreprise ne pourrait pas y répondre — '
          + 'ce que la publication du code de la CNAF n\'a pas résolu non plus.</p></div>';
        cloturePartielle(e, avant);
      }
    });
  });
}

/* ---------- 4. bouclage ---------- */

function vueBouclage(){
  if (!etat.ordre.length) etat.ordre = etat.ordreFait.slice();
  etat.ordreFait.forEach(function(id){
    if (etat.ordre.indexOf(id) === -1) etat.ordre.push(id);
  });

  afficher('<div class="commande"><h1>Boucler le dossier</h1>'
  + '<p class="large">Les volets versés paraissent. Reste à décider dans quel ordre.</p>'
  + '<p class="large gris">Le premier fera la une'+(etat.ordre.length>1?', le reste les pages intérieures':'')+'. '
  + 'Aucun ordre n\'est le bon : celui-ci est le vôtre et n\'est pas évalué.</p></div>'
  + '<section class="etape"><h2>Votre chemin de fer</h2>'
  + '<p class="consigne">Les volets sont d\'abord rangés dans l\'ordre où vous les avez menés. Déplacez-les jusqu\'à l\'ordre de parution voulu.</p>'
  + '<ol class="rangs" id="rangs"></ol>'
  + '<div class="barre"><button type="button" id="publier">Publier</button>'
  + '<button type="button" class="secondaire" id="revenir">Revenir à la rédaction</button></div>'
  + '<p class="gris" id="annonce" aria-live="polite" style="margin-top:14px"></p></section>');

  dessinerRangs(null);
  document.getElementById('publier').addEventListener('click', vueUne);
  document.getElementById('revenir').addEventListener('click', vueHub);
}

function placeDe(i){
  return i === 0 ? 'Une' : 'Pages intérieures';
}

function dessinerRangs(refocus){
  var ol = document.getElementById('rangs');
  ol.innerHTML = etat.ordre.map(function(id, i){
    var e = trouver(id);
    return '<li class="rang'+(i===0?' tete':'')+'">'
         + '<span class="place">'+placeDe(i)+'</span>'
         + '<span class="titre-rang">'+e.titre+'</span>'
         + '<span class="actions">'
         + '<button type="button" class="secondaire petit deplacer" data-id="'+id+'" data-sens="-1"'+(i===0?' disabled':'')+' aria-label="Monter : '+e.titre+'">↑</button>'
         + '<button type="button" class="secondaire petit deplacer" data-id="'+id+'" data-sens="1"'+(i===etat.ordre.length-1?' disabled':'')+' aria-label="Descendre : '+e.titre+'">↓</button>'
         + '</span></li>';
  }).join('');

  ol.querySelectorAll('.deplacer').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.id, sens = +b.dataset.sens;
      var i = etat.ordre.indexOf(id), j = i + sens;
      if (j < 0 || j >= etat.ordre.length) return;
      etat.ordre[i] = etat.ordre[j];
      etat.ordre[j] = id;
      dessinerRangs({id:id, sens:sens});
      var e = trouver(id);
      document.getElementById('annonce').textContent = e.titre + ' — désormais en position ' + (j+1) + ' : ' + placeDe(j) + '.';
    });
  });

  if (refocus){
    var cible = ol.querySelector('.deplacer[data-id="'+refocus.id+'"][data-sens="'+refocus.sens+'"]');
    if (cible && !cible.disabled) cible.focus();
    else {
      var autre = ol.querySelector('.deplacer[data-id="'+refocus.id+'"]:not([disabled])');
      if (autre) autre.focus();
    }
  }
}

/* ---------- 5. la une ---------- */

function vueUne(){
  var liste = etat.ordre.map(trouver);
  var une = liste[0], ints = liste.slice(1);

  afficher(
    '<div class="commande noprint"><h1>Votre numéro</h1>'
  + '<p class="large gris">'+liste.length+' volet'+(liste.length>1?'s':'')+', dans l\'ordre que vous avez choisi.</p></div>'
  + '<div class="une">'
  + '<p class="bandeau">Coulisses IA — dossier</p>'
  + '<h2 class="titre-une">'+une.titre+'</h2>'
  + '<p class="chapo-une">'+une.piece+'</p>'
  + (ints.length ? '<div class="interieures">'
      + ints.map(function(e){ return '<div><h4>'+e.titre+'</h4><p>'+e.piece+'</p></div>'; }).join('')
      + '</div>' : '')
  + '</div>'
  + '<div class="barre noprint">'
  + '<button type="button" id="imprimer">Imprimer ou enregistrer en PDF</button>'
  + '<button type="button" class="secondaire" id="refaire">Modifier l\'ordre</button>'
  + '</div>'
  + '<p class="consigne noprint" style="margin-top:22px">'+(liste.length>1
      ? 'La plupart des lecteurs s\'arrêteront au premier volet. Décider de l\'ordre, c\'est décider de ce qui sera lu.'
      : 'Une seule pièce au dossier pour l\'instant. Vous pouvez revenir à la rédaction pour en verser d\'autres avant de publier.')+'</p>'
  );

  document.getElementById('imprimer').addEventListener('click', function(){ window.print(); });
  document.getElementById('refaire').addEventListener('click', vueBouclage);
}

var SEUIL_BOUCLAGE = 2;
var STORAGE_KEY = 'ci_amont_v1';

function sauvegarder(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      faites: etat.faites, ordreFait: etat.ordreFait, consigne: etat.consigne
    }));
  } catch (err) { /* stockage indisponible : la session continue sans persister */ }
}
function chargerSauvegarde(){
  try {
    var brut = localStorage.getItem(STORAGE_KEY);
    if (!brut) return null;
    var data = JSON.parse(brut);
    return (data && typeof data === 'object') ? data : null;
  } catch (err) { return null; }
}
function effacerSauvegarde(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
}

(function demarrer(){
  var sauvegarde = chargerSauvegarde();
  if (sauvegarde && sauvegarde.faites && Object.keys(sauvegarde.faites).length > 0){
    etat.faites = sauvegarde.faites;
    etat.ordreFait = sauvegarde.ordreFait || Object.keys(sauvegarde.faites);
    etat.consigne = sauvegarde.consigne || '';
    etat.reprise = true;
    vueHub();
  } else {
    vueAccueil();
  }
})();

})();
